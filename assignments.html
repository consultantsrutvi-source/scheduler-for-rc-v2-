<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Assignments | Scheduler CRM</title>

<style>
body {
  margin: 0;
  font-family: Inter, Arial, sans-serif;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  color: #fff;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(10px);
}

header img {
  height: 38px;
  border-radius: 10px;
}

nav a {
  color: #fff;
  margin-left: 18px;
  text-decoration: none;
  font-weight: 500;
}

.container {
  padding: 24px;
}

.section-title {
  font-size: 20px;
  margin: 20px 0 12px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 18px;
}

.card {
  background: linear-gradient(145deg, #1f2933, #111827);
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 20px 40px rgba(0,0,0,.45);
}

.card h3 {
  margin: 0 0 6px;
}

.small {
  font-size: 13px;
  opacity: .9;
}

.btn {
  border: none;
  border-radius: 10px;
  padding: 8px 12px;
  margin-top: 10px;
  cursor: pointer;
  font-weight: 600;
}

.auto { background:#0ea5e9; }
.manual { background:#8b5cf6; }
.assign { background:#22c55e; }
.reject { background:#ef4444; }

.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
</style>
</head>

<body>

<header>
  <img src="logo.png.jpg" />
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a href="assignments.html">Assignments</a>
  </nav>
</header>

<div class="container">

  <div class="section-title">Open Vacancies</div>
  <div id="vacancies" class="grid"></div>

  <div class="section-title">Assigned Today</div>
  <div id="assignedToday" class="grid"></div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";

async function loadVacancies() {
  const res = await fetch(API + "?action=getOpenVacancies");
  const data = await res.json();
  const box = document.getElementById("vacancies");
  box.innerHTML = "";

  data.forEach(v => {
    if (Number(v.FacultyRequired) <= 0) return;

    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = `
      <h3>${v.CollegeName}</h3>
      <div class="small">${v.VacancyID}</div>
      <div class="small">${v.City} · ${v.Subject}</div>
      <div class="small">Level: ${v.Level}</div>
      <div class="small">Faculty Required: ${v.FacultyRequired}</div>
      <div class="small">Salary: ₹${v.SalaryFrom} – ₹${v.SalaryTo}</div>
      <div class="small">${v.Notes || ""}</div>

      <div class="row">
        <button class="btn auto" onclick="autoAssign('${v.VacancyID}')">Auto Assign</button>
        <button class="btn manual" onclick="manualAssign('${v.VacancyID}')">Manual Assign</button>
      </div>
    `;
    box.appendChild(c);
  });
}

async function autoAssign(vacancyId) {
  alert("Auto assign logic ready. Top 3 lecturers will show here.");
}

async function manualAssign(vacancyId) {
  alert("Manual assign list will show here.");
}

async function loadAssignedToday() {
  const res = await fetch(API + "?action=getAssignmentsToday");
  const data = await res.json();
  const box = document.getElementById("assignedToday");
  box.innerHTML = "";

  data.forEach(a => {
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = `
      <h3>${a.LecturerName}</h3>
      <div class="small">${a.VacancyID}</div>
      <div class="small">${a.AssignmentType}</div>

      <div class="row">
        <button class="btn assign">Selected</button>
        <button class="btn reject">Not Selected</button>
      </div>
    `;
    box.appendChild(c);
  });
}

loadVacancies();
loadAssignedToday();
</script>

</body>
</html>
