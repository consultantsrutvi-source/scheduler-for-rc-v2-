<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Assignments | Scheduler</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", Roboto, Arial, sans-serif;
  background: #f4f6f9;
  color: #222;
}

header {
  background: linear-gradient(90deg, #1f3c88, #3a6ea5);
  color: white;
  padding: 14px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

header img {
  height: 38px;
  border-radius: 8px;
}

nav a {
  color: #fff;
  margin-left: 18px;
  text-decoration: none;
  font-weight: 500;
}

main {
  padding: 24px;
}

.section-title {
  font-size: 20px;
  margin: 18px 0 12px;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 18px;
}

.card {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}

.card h3 {
  margin: 0 0 6px;
}

.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 12px;
  background: #e8edf5;
  margin-right: 6px;
}

.btn {
  padding: 8px 14px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  margin-right: 6px;
  font-weight: 600;
}

.btn-auto { background: #3a6ea5; color: white; }
.btn-manual { background: #6a5acd; color: white; }
.btn-assign { background: #28a745; color: white; }
.btn-selected { background: #28a745; color: white; }
.btn-reject { background: #dc3545; color: white; }

.hidden { display: none; }

.print-btn {
  background: #444;
  color: #fff;
  float: right;
}
</style>
</head>

<body>

<header>
  <img src="logo.png.jpg" alt="Logo">
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lectures.html">Lecturers</a>
    <a href="#" onclick="logout()">Logout</a>
  </nav>
</header>

<main>

<h2 class="section-title">Open Vacancies</h2>
<div id="vacancyCards" class="card-grid"></div>

<h2 class="section-title">
  Assigned Today
  <button class="btn print-btn" onclick="window.print()">Print</button>
</h2>
<div id="assignedCards" class="card-grid"></div>

</main>

<script>
const API_BASE = "https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";

function safe(v) {
  return v === undefined || v === null || v === "" ? "-" : v;
}

async function fetchJSON(url) {
  const res = await fetch(url);
  return res.json();
}

async function loadVacancies() {
  const data = await fetchJSON(`${API_BASE}?action=getOpenVacancies`);
  const container = document.getElementById("vacancyCards");
  container.innerHTML = "";

  data.forEach(v => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <h3>${safe(v.CollegeName)}</h3>
      <div class="badge">${safe(v.VacancyID)}</div>
      <div class="badge">${safe(v.Subject)} | ${safe(v.Level)}</div>
      <p>City: ${safe(v.City)}</p>
      <p>Salary: ${safe(v.SalaryFrom)} – ${safe(v.SalaryTo)}</p>
      <p>Faculty Required: ${safe(v.FacultyRequired)}</p>
      <p>${safe(v.Notes)}</p>
      <button class="btn btn-auto" onclick="autoAssign('${v.VacancyID}')">Auto Assign</button>
      <button class="btn btn-manual" onclick="manualAssign('${v.VacancyID}')">Manual Assign</button>
    `;
    container.appendChild(card);
  });
}

async function autoAssign(vacancyId) {
  const data = await fetchJSON(`${API_BASE}?action=autoAssign&vacancyId=${vacancyId}`);
  renderLecturers(data, vacancyId);
}

async function manualAssign(vacancyId) {
  const data = await fetchJSON(`${API_BASE}?action=getMatchingLecturers&vacancyId=${vacancyId}`);
  renderLecturers(data, vacancyId);
}

function renderLecturers(list, vacancyId) {
  const container = document.getElementById("vacancyCards");
  container.innerHTML = "";

  list.forEach(l => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <h3>${safe(l.Name)}</h3>
      <div class="badge">${safe(l.LecturerID)}</div>
      <p>City: ${safe(l.City)}</p>
      <p>Salary: ${safe(l.SalaryFrom)} – ${safe(l.SalaryTo)}</p>
      <button class="btn btn-assign" onclick="assign('${vacancyId}','${l.LecturerID}')">Assign</button>
    `;
    container.appendChild(card);
  });
}

async function assign(vacancyId, lecturerId) {
  await fetchJSON(`${API_BASE}?action=assign&vacancyId=${vacancyId}&lecturerId=${lecturerId}`);
  loadAssignments();
  loadVacancies();
}

async function loadAssignments() {
  const data = await fetchJSON(`${API_BASE}?action=getTodayAssignments`);
  const container = document.getElementById("assignedCards");
  container.innerHTML = "";

  data.forEach(a => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <h3>${safe(a.CollegeName)}</h3>
      <p>${safe(a.LecturerName)}</p>
      <div class="badge">${safe(a.AssignmentStatus)}</div>
      <button class="btn btn-selected" onclick="updateStatus('${a.AssignmentID}','Selected')">Selected</button>
      <button class="btn btn-reject" onclick="updateStatus('${a.AssignmentID}','Not Selected')">Not Selected</button>
    `;
    container.appendChild(card);
  });
}

async function updateStatus(id, status) {
  await fetchJSON(`${API_BASE}?action=updateAssignmentStatus&id=${id}&status=${status}`);
  loadAssignments();
  loadVacancies();
}

function logout() {
  localStorage.clear();
  location.href = "index.html";
}

loadVacancies();
loadAssignments();
</script>

</body>
</html>
