<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Assignments | Scheduler CRM</title>

<!-- =================== CONFIG =================== -->
<script>
const API = "https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";
</script>

<!-- =================== STYLE =================== -->
<style>
:root{
  --primary:#2563eb;
  --bg:#f8fafc;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#0f172a;
  --muted:#64748b;
  --success:#16a34a;
  --danger:#dc2626;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
  color:var(--text);
}
header{
  background:white;
  border-bottom:1px solid var(--border);
  padding:14px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
header img{
  height:36px;
}
nav a{
  margin-left:20px;
  text-decoration:none;
  color:var(--muted);
  font-weight:500;
}
nav a.active{color:var(--primary)}

main{
  padding:28px;
  max-width:1400px;
  margin:auto;
}

h2{margin-top:40px}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:20px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.04);
}

.badge{
  display:inline-block;
  padding:4px 10px;
  font-size:12px;
  border-radius:20px;
  background:#e0e7ff;
  color:#1e40af;
  margin-bottom:10px;
}

.btn{
  background:var(--primary);
  color:white;
  border:none;
  border-radius:8px;
  padding:10px 14px;
  cursor:pointer;
}
.btn.secondary{
  background:#e5e7eb;
  color:#111827;
}
.btn.success{background:var(--success)}
.btn.danger{background:var(--danger)}
select,input{
  width:100%;
  padding:8px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid var(--border);
}
.row{margin-top:8px}
.small{font-size:13px;color:var(--muted)}
.hidden{display:none}
</style>
</head>

<body>

<!-- =================== HEADER =================== -->
<header>
  <div style="display:flex;align-items:center;gap:12px">
    <img src="logo.png.jpg" alt="CRM Logo" onerror="this.style.display='none'">
    <strong>Scheduler CRM</strong>
  </div>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a class="active" href="assignments.html">Assignments</a>
  </nav>
</header>

<!-- =================== MAIN =================== -->
<main>

<h2>Open Vacancies</h2>
<div id="vacancies" class="grid"></div>

<h2>Assigned Today</h2>
<div id="assignedToday" class="grid"></div>

</main>

<!-- =================== SCRIPT =================== -->
<script>
let VACANCIES=[], LECTURERS=[], ASSIGNMENTS=[];
const cache = {};

async function loadAll(){
  const [v,l,a] = await Promise.all([
    fetch(API+"?action=getVacancies").then(r=>r.json()),
    fetch(API+"?action=getLecturers").then(r=>r.json()),
    fetch(API+"?action=getAssignments").then(r=>r.json())
  ]);
  VACANCIES=v; LECTURERS=l; ASSIGNMENTS=a;
  render();
}

function render(){
  renderVacancies();
  renderAssignedToday();
}

/* ---------------- VACANCIES ---------------- */
function renderVacancies(){
  const box=document.getElementById("vacancies");
  box.innerHTML="";
  VACANCIES.filter(v=>v.status==="Open").forEach(v=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <span class="badge">OPEN</span>
      <h3>${v.college}</h3>
      <div class="small">${v.city} • ${v.subject}</div>
      <div class="row small">Faculty Required: <b id="fac-${v.id}">${v.faculty}</b></div>

      <div class="row">
        <select id="lec-${v.id}">
          <option value="">Select Lecturer</option>
          ${LECTURERS.filter(l=>l.subject===v.subject && l.status==="Active")
            .map(l=>`<option value="${l.id}|${l.name}">${l.name}</option>`).join("")}
        </select>
      </div>

      <div class="row">
        <input type="number" id="sal-${v.id}" placeholder="Agreed Salary (dummy)">
      </div>

      <div class="row">
        <button class="btn" onclick="assign('${v.id}')">Assign Lecturer</button>
      </div>
    `;
    box.appendChild(card);
  });
}

/* ---------------- ASSIGN ---------------- */
async function assign(vacancyId){
  const sel=document.getElementById("lec-"+vacancyId);
  if(!sel.value) return alert("Select lecturer");
  const [lecId,lecName]=sel.value.split("|");
  const sal=document.getElementById("sal-"+vacancyId).value||0;

  const v=VACANCIES.find(x=>x.id===vacancyId);

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"addAssignment",
      vacancyId:v.id,
      college:v.college,
      city:v.city,
      subject:v.subject,
      level:v.level,
      lecturerId:lecId,
      lecturerName:lecName,
      agreedSalary:sal
    })
  });

  v.faculty--;
  if(v.faculty<=0) v.status="Closed";
  render();
}

/* ---------------- ASSIGNED TODAY ---------------- */
function renderAssignedToday(){
  const box=document.getElementById("assignedToday");
  box.innerHTML="";
  ASSIGNMENTS.filter(a=>a.status==="Assigned").forEach(a=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <h3>${a.college}</h3>
      <div class="small">${a.subject} • ${a.lecturerName}</div>
      <div class="row">
        <button class="btn success" onclick="updateStatus('${a.assignmentId}','Selected')">Selected</button>
        <button class="btn danger" onclick="updateStatus('${a.assignmentId}','Not Selected')">Not Selected</button>
      </div>
    `;
    box.appendChild(card);
  });
}

/* ---------------- STATUS UPDATE ---------------- */
async function updateStatus(id,status){
  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"updateAssignmentStatus",
      assignmentId:id,
      status
    })
  });
  loadAll();
}

loadAll();
</script>

</body>
</html>
