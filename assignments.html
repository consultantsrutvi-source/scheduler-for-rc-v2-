<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assignments | Scheduler CRM</title>

<style>
/* ---------- BASE ---------- */
body {
  margin: 0;
  font-family: Inter, system-ui, Arial, sans-serif;
  background: linear-gradient(135deg, #f4f7fb, #eaf1ff);
  color: #1f2937;
}

header {
  background: linear-gradient(90deg, #2563eb, #3b82f6);
  padding: 14px 24px;
  color: #fff;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header b {
  font-size: 18px;
}

nav a {
  color: #fff;
  text-decoration: none;
  margin-left: 18px;
  font-weight: 500;
}

.container {
  padding: 24px;
}

/* ---------- SECTIONS ---------- */
.section-title {
  font-size: 18px;
  font-weight: 600;
  margin: 16px 0 10px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 16px;
}

/* ---------- CARDS ---------- */
.card {
  background: #ffffff;
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 14px 30px rgba(0,0,0,0.08);
}

.card h3 {
  margin: 0 0 6px;
}

.badge {
  display: inline-block;
  padding: 4px 10px;
  font-size: 12px;
  border-radius: 999px;
  background: #e0e7ff;
  color: #1e3a8a;
  margin-right: 6px;
}

/* ---------- BUTTONS ---------- */
.btn {
  border: none;
  padding: 8px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 500;
}

.btn-primary { background: #2563eb; color: #fff; }
.btn-secondary { background: #e5e7eb; }
.btn-success { background: #16a34a; color: #fff; }
.btn-danger { background: #dc2626; color: #fff; }

input[type="number"] {
  width: 80px;
  padding: 4px;
}

/* ---------- LECTURERS ---------- */
.lecturer {
  background: #f9fafb;
  padding: 10px;
  margin-top: 8px;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
</style>
</head>

<body>

<header>
  <b>Scheduler CRM</b>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a href="assignments.html">Assignments</a>
  </nav>
</header>

<div class="container">

  <div class="section-title">Open Vacancies</div>
  <div id="vacancyGrid" class="grid"></div>

  <div class="section-title">Assigned Today</div>
  <div id="assignedGrid" class="grid"></div>

</div>

<script>
/* ================= CONFIG ================= */
const API_BASE =
"https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";

/* ================= LOAD ================= */
document.addEventListener("DOMContentLoaded", () => {
  loadVacancies();
  loadAssignments();
});

/* ================= HELPERS ================= */
async function apiGet(action, params={}) {
  const q = new URLSearchParams({ action, ...params });
  const r = await fetch(`${API_BASE}?${q}`);
  return r.json();
}

async function apiPost(action, data) {
  const r = await fetch(`${API_BASE}?action=${action}`, {
    method: "POST",
    body: JSON.stringify(data)
  });
  return r.json();
}

/* ================= VACANCIES ================= */
async function loadVacancies() {
  const data = await apiGet("getVacancies");
  const grid = document.getElementById("vacancyGrid");
  grid.innerHTML = "";

  data.forEach(v => {
    if (v.status !== "Open") return;

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <h3>${v.college}</h3>
      <div class="badge">${v.subject}</div>
      <div class="badge">${v.level}</div>
      <p><b>City:</b> ${v.city}</p>
      <p><b>Faculty Required:</b>
         <span id="fac-${v.id}">${v.faculty}</span></p>

      <button class="btn btn-primary"
        onclick="autoAssign('${v.id}','${v.subject}','${v.level}')">
        Auto Assign
      </button>

      <button class="btn btn-secondary"
        onclick="manualAssign('${v.id}','${v.subject}')">
        Manual Assign
      </button>

      <div id="lecturers-${v.id}"></div>
    `;

    grid.appendChild(card);
  });
}

/* ================= AUTO ASSIGN ================= */
async function autoAssign(vacId, subject, level) {
  const lecturers = await apiGet("getLecturers");
  const matches = lecturers
    .filter(l => l.subject === subject && l.level === level && l.status === "Active")
    .slice(0, 3);

  renderLecturers(vacId, matches, "Auto");
}

/* ================= MANUAL ASSIGN ================= */
async function manualAssign(vacId, subject) {
  const lecturers = await apiGet("getLecturers");
  const matches = lecturers.filter(l => l.subject === subject && l.status === "Active");
  renderLecturers(vacId, matches, "Manual");
}

/* ================= RENDER ================= */
function renderLecturers(vacId, list, mode) {
  const box = document.getElementById(`lecturers-${vacId}`);
  box.innerHTML = "";

  list.forEach(l => {
    const row = document.createElement("div");
    row.className = "lecturer";

    row.innerHTML = `
      <span>${l.name} (${l.city})</span>
      <span>
        ₹<input type="number" id="sal-${vacId}-${l.id}" value="0"/>
        <button class="btn btn-success"
          onclick="assign('${vacId}','${l.id}','${l.name}','${mode}')">
          Assign
        </button>
      </span>
    `;

    box.appendChild(row);
  });
}

/* ================= ASSIGN ================= */
async function assign(vacId, lecId, lecName, type) {
  const facEl = document.getElementById(`fac-${vacId}`);
  let remaining = Number(facEl.innerText);

  if (remaining <= 0) {
    alert("Faculty requirement already fulfilled");
    return;
  }

  const salary =
    Number(document.getElementById(`sal-${vacId}-${lecId}`).value || 0);

  await apiPost("addAssignment", {
    vacancyId: vacId,
    lecturerId: lecId,
    lecturerName: lecName,
    assignmentType: type,
    agreedSalary: salary
  });

  facEl.innerText = remaining - 1;

  if (remaining - 1 === 0) {
    await apiPost("updateAssignmentStatus", {
      assignmentId: vacId,
      status: "Closed"
    });
  }

  loadAssignments();
}

/* ================= ASSIGNED ================= */
async function loadAssignments() {
  const data = await apiGet("getAssignments");
  const grid = document.getElementById("assignedGrid");
  grid.innerHTML = "";

  data.forEach(a => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <h3>${a.lecturerName}</h3>
      <div class="badge">${a.assignmentType}</div>
      <div class="badge">${a.status}</div>

      <button class="btn btn-success"
        onclick="updateStatus('${a.assignmentId}','Selected')">
        Selected
      </button>

      <button class="btn btn-danger"
        onclick="updateStatus('${a.assignmentId}','Not Selected')">
        Not Selected
      </button>
    `;

    grid.appendChild(card);
  });
}

/* ================= STATUS ================= */
async function updateStatus(id, status) {
  await apiPost("updateAssignmentStatus", {
    assignmentId: id,
    status
  });
  loadVacancies();
  loadAssignments();
}
</script>

</body>
</html>
