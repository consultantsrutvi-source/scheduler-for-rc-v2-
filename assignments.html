<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assignments | Scheduler CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#f4f7ff;
  --card:#ffffff;
  --primary:#2563eb;
  --success:#16a34a;
  --danger:#dc2626;
  --muted:#64748b;
  --border:#e5e7eb;
  --shadow:0 12px 30px rgba(0,0,0,.08);
}
*{box-sizing:border-box;font-family:Inter,system-ui}
body{margin:0;background:var(--bg)}

header{
  display:flex;align-items:center;gap:14px;
  padding:14px 24px;background:#fff;
  border-bottom:1px solid var(--border);
}
header img{height:38px}
nav{margin-left:auto;display:flex;gap:18px}
nav a{text-decoration:none;color:#334155;font-weight:500}
nav a.active{color:var(--primary);font-weight:600}

main{max-width:1400px;margin:auto;padding:24px}
h2{margin:30px 0 14px}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:20px;
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:18px;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
}

.badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}
.open{background:#dcfce7;color:#166534}
.assigned{background:#dbeafe;color:#1e40af}

.small{font-size:13px;color:var(--muted)}

button{
  border:none;
  border-radius:12px;
  padding:10px 16px;
  cursor:pointer;
  font-weight:600;
}
.primary{background:var(--primary);color:#fff}
.success{background:var(--success);color:#fff}
.danger{background:var(--danger);color:#fff}
button:disabled{opacity:.6}

.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  box-shadow:var(--shadow);
}
th,td{
  padding:12px;
  border-bottom:1px solid var(--border);
  text-align:left;
}
th{background:#f1f5f9}

@media print{
  header,nav,button{display:none}
}
</style>
</head>

<body>

<header>
  <img src="logo.png.jpg">
  <strong>Scheduler CRM</strong>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a class="active">Assignments</a>
  </nav>
</header>

<main>

<h2>Open Vacancies</h2>
<div id="vacancyCards" class="grid"></div>

<h2>Assigned Today</h2>
<table>
<thead>
<tr>
  <th>Assignment ID</th>
  <th>College</th>
  <th>Subject</th>
  <th>Lecturer</th>
  <th>Status</th>
</tr>
</thead>
<tbody id="assignedToday"></tbody>
</table>

</main>

<script>
const API = "https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";

let VACANCIES=[], LECTURERS=[], ASSIGNMENTS=[];

document.addEventListener("DOMContentLoaded", init);

async function init(){
  const [v,l,a] = await Promise.all([
    fetch(API+"?action=getVacancies").then(r=>r.json()),
    fetch(API+"?action=getLecturers").then(r=>r.json()),
    fetch(API+"?action=getAssignments").then(r=>r.json())
  ]);
  VACANCIES=v||[];
  LECTURERS=l||[];
  ASSIGNMENTS=a||[];
  render();
}

function render(){
  renderVacancies();
  renderAssignedToday();
}

function renderVacancies(){
  const wrap=document.getElementById("vacancyCards");
  wrap.innerHTML="";

  VACANCIES
    .filter(v=>v.status==="Open" && Number(v.faculty)>0)
    .forEach(v=>{
      const card=document.createElement("div");
      card.className="card";

      const matched=LECTURERS.filter(l=>
        l.subject===v.subject && l.status==="Active"
      );

      card.innerHTML=`
        <span class="badge open">OPEN</span>
        <h3>${v.college}</h3>
        <div class="small">${v.city} • ${v.subject} • ${v.level}</div>
        <div class="small">Faculty Required: <b>${v.faculty}</b></div>
        <hr>

        ${matched.map(l=>`
          <div class="card" style="margin-top:10px;background:#f8fafc">
            <b>${l.name}</b>
            <div class="small">
              ${l.subject} • ${l.level}<br>
              Exp: ${l.experience} yrs<br>
              City: ${l.city}<br>
              Salary: ₹${l.salaryFrom} - ₹${l.salaryTo}
            </div>
            <button class="primary" onclick="assign('${v.id}','${l.id}')">
              Assign
            </button>
          </div>
        `).join("")}
      `;

      wrap.appendChild(card);
    });
}

async function assign(vacancyId, lecturerId){
  const v = VACANCIES.find(x=>x.id===vacancyId);
  const l = LECTURERS.find(x=>x.id===lecturerId);
  if(!v || !l) return;

  const payload={
    vacancyId:v.id,
    college:v.college,
    city:v.city,
    subject:v.subject,
    level:v.level,
    lecturerId:l.id,
    lecturerName:l.name,
    agreedSalary:0,
    assignmentType:"Manual"
  };

  const res = await fetch(API+"?action=addAssignment",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)
  });
  const data = await res.json();

  if(!data.success){
    alert("Assignment failed");
    return;
  }

  alert("Assignment saved successfully\nAssignment ID: "+(data.assignmentId||"Generated"));

  init();
}

function renderAssignedToday(){
  const tbody=document.getElementById("assignedToday");
  tbody.innerHTML="";
  ASSIGNMENTS.filter(a=>a.status==="Assigned").forEach(a=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${a.assignmentId}</td>
      <td>${a.college}</td>
      <td>${a.subject}</td>
      <td>${a.lecturerName}</td>
      <td><span class="badge assigned">Assigned</span></td>
    `;
    tbody.appendChild(tr);
  });
}
</script>

</body>
</html>
