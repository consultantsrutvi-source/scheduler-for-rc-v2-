<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Assignments | Scheduler CRM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Inter,system-ui;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:#0f172a;
}
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 28px;
  background:linear-gradient(90deg,#2563eb,#22c55e);
  color:#fff;
}
header img{
  height:36px;
  border-radius:10px;
}
nav a{
  margin:0 14px;
  color:#fff;
  text-decoration:none;
  font-weight:600;
}
.logout{
  background:#ef4444;
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
}
.container{
  padding:28px;
}
.filters{
  display:flex;
  gap:14px;
  margin-bottom:24px;
}
select,input{
  padding:10px;
  border-radius:10px;
  border:1px solid #e5e7eb;
}
.section-title{
  color:#fff;
  margin:30px 0 12px;
}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:18px;
}
.card{
  background:#fff;
  border-radius:16px;
  padding:18px;
  box-shadow:0 10px 25px rgba(0,0,0,.15);
}
.card h3{margin:0 0 6px}
.badge{
  display:inline-block;
  background:#e5e7eb;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
}
.btn{
  padding:10px 14px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:600;
}
.auto{background:linear-gradient(90deg,#2563eb,#38bdf8);color:#fff}
.manual{background:linear-gradient(90deg,#7c3aed,#a78bfa);color:#fff}
.assign{background:#22c55e;color:#fff}
.reject{background:#ef4444;color:#fff}
.sub{
  margin-top:12px;
  padding-top:12px;
  border-top:1px dashed #e5e7eb;
}
.print{
  float:right;
  background:#fff;
  border-radius:10px;
  padding:8px 14px;
  cursor:pointer;
}
@media print{
  header,.filters,.section-title:not(.printable){display:none}
  body{background:#fff}
}
</style>
</head>

<body>

<header>
  <div style="display:flex;align-items:center;gap:12px">
    <img src="logo.png" alt="Logo">
    <strong>Scheduler CRM</strong>
  </div>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a href="assignments.html">Assignments</a>
  </nav>
  <div class="logout" onclick="logout()">Logout</div>
</header>

<div class="container">

  <!-- FILTERS -->
  <div class="filters">
    <select id="cityFilter"><option value="">All Cities</option></select>
    <select id="subjectFilter"><option value="">All Subjects</option></select>
    <select id="levelFilter"><option value="">All Levels</option></select>
  </div>

  <!-- OPEN VACANCIES -->
  <h2 class="section-title">Open Vacancies</h2>
  <div class="cards" id="vacancies"></div>

  <!-- ASSIGNED TODAY -->
  <h2 class="section-title printable">
    Assigned Today
    <span class="print" onclick="window.print()">Print</span>
  </h2>
  <div class="cards printable" id="assignedToday"></div>

</div>

<script src="js/places.js"></script>
<script>
const API = "https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";

function logout(){
  localStorage.clear();
  location.href="index.html";
}

/* ---------- LOAD DATA ---------- */
async function fetchJSON(params){
  const r = await fetch(API+"?"+new URLSearchParams(params));
  return r.json();
}

/* ---------- INIT ---------- */
document.addEventListener("DOMContentLoaded",async()=>{
  cities.forEach(c=>cityFilter.innerHTML+=`<option>${c}</option>`);
  ["Physics","Chemistry","Biology","Maths"].forEach(s=>subjectFilter.innerHTML+=`<option>${s}</option>`);
  ["KCET","NEET","Boards","JEE","Foundation"].forEach(l=>levelFilter.innerHTML+=`<option>${l}</option>`);
  loadVacancies();
  loadAssignedToday();
});

/* ---------- LOAD VACANCIES ---------- */
async function loadVacancies(){
  const data = await fetchJSON({action:"getVacancies"});
  vacancies.innerHTML="";
  data.forEach(v=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <h3>${v.CollegeName}</h3>
      <div class="badge">${v.City}</div>
      <p>${v.Subject} • ${v.Level}</p>
      <p>Faculty Required: <b>${v.FacultyRequired}</b></p>
      <p>Salary: ₹${v.SalaryFrom} – ₹${v.SalaryTo}</p>
      <button class="btn auto" onclick="autoAssign('${v.VacancyID}',this)">Auto Assign</button>
      <button class="btn manual" onclick="manualAssign('${v.VacancyID}',this)">Manual Assign</button>
      <div class="sub"></div>
    `;
    vacancies.appendChild(card);
  });
}

/* ---------- AUTO ASSIGN ---------- */
async function autoAssign(vacancyId,btn){
  const box=btn.parentElement.querySelector(".sub");
  box.innerHTML="<b>Top 3 Suggested Lecturers</b>";
  const list=await fetchJSON({action:"autoAssign",vacancyId});
  list.forEach(l=>{
    box.innerHTML+=`
      <div class="card sub">
        <b>${l.Name}</b> • ${l.City}<br>
        Exp: ${l.Experience} yrs | ₹${l.SalaryFrom}–${l.SalaryTo}<br>
        <button class="btn assign" onclick="assign('${vacancyId}','${l.LecturerID}')">Assign for Interview</button>
      </div>`;
  });
}

/* ---------- MANUAL ASSIGN ---------- */
async function manualAssign(vacancyId,btn){
  const box=btn.parentElement.querySelector(".sub");
  const list=await fetchJSON({action:"manualAssign",vacancyId});
  box.innerHTML="<b>Available Lecturers</b>";
  list.forEach(l=>{
    box.innerHTML+=`
      <div class="card sub">
        <b>${l.Name}</b> • ${l.City}<br>
        Exp: ${l.Experience} yrs | ₹${l.SalaryFrom}–${l.SalaryTo}<br>
        <button class="btn assign" onclick="assign('${vacancyId}','${l.LecturerID}')">Assign for Interview</button>
      </div>`;
  });
}

/* ---------- ASSIGN ---------- */
async function assign(vacancyId,lecturerId){
  await fetchJSON({action:"assign",vacancyId,lecturerId});
  loadVacancies();
  loadAssignedToday();
}

/* ---------- ASSIGNED TODAY ---------- */
async function loadAssignedToday(){
  const data=await fetchJSON({action:"getAssignmentsToday"});
  assignedToday.innerHTML="";
  data.forEach(a=>{
    assignedToday.innerHTML+=`
      <div class="card">
        <b>${a.CollegeName}</b><br>
        ${a.Subject} • ${a.Level}<br>
        Lecturer: <b>${a.LecturerName}</b><br><br>
        <button class="btn assign" onclick="markSelected('${a.AssignmentID}')">Selected</button>
        <button class="btn reject" onclick="markRejected('${a.AssignmentID}')">Not Selected</button>
      </div>`;
  });
}

async function markSelected(id){
  await fetchJSON({action:"markSelected",id});
  loadVacancies(); loadAssignedToday();
}
async function markRejected(id){
  await fetchJSON({action:"markRejected",id});
  loadVacancies(); loadAssignedToday();
}
</script>
</body>
</html>
