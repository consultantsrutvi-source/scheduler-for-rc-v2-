<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Assignments | Scheduler CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- ===== STYLE ===== -->
<style>
:root{
  --green:#2fa36b;
  --yellow:#fff6cc;
  --light:#f9fafb;
  --card:#ffffff;
  --shadow:0 10px 25px rgba(0,0,0,.08);
}
body{
  margin:0;
  font-family: "Segoe UI", sans-serif;
  background:linear-gradient(135deg,#fffde7,#e8f5e9);
}
header{
  background:linear-gradient(90deg,#1f8f5f,#2fa36b);
  color:#fff;
  padding:14px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
header img{
  height:42px;
  border-radius:10px;
}
nav a{
  color:#fff;
  margin:0 12px;
  text-decoration:none;
  font-weight:500;
}
nav a.active{border-bottom:2px solid #fff;}
.logout{
  background:#fff;
  color:#2fa36b;
  padding:6px 14px;
  border-radius:20px;
  cursor:pointer;
  font-weight:600;
}
main{padding:28px;}

/* ===== FILTERS ===== */
.filters{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;
  margin-bottom:22px;
}
select{
  padding:10px;
  border-radius:10px;
  border:1px solid #ddd;
}

/* ===== CARDS ===== */
.section-title{
  font-size:20px;
  margin:20px 0 10px;
  color:#1f8f5f;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:20px;
}
.card{
  background:var(--card);
  border-radius:18px;
  padding:18px;
  box-shadow:var(--shadow);
}
.badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:20px;
  background:#e0f2f1;
  color:#00695c;
  font-size:12px;
}
.btn{
  padding:8px 14px;
  border:none;
  border-radius:18px;
  cursor:pointer;
  font-weight:600;
}
.btn.green{background:var(--green);color:#fff;}
.btn.yellow{background:#ffeb3b;}
.btn.gray{background:#eee;}
.btn.full{width:100%;margin-top:10px;}
.assign-box{
  margin-top:10px;
  padding:10px;
  border-radius:12px;
  background:#f1f8e9;
}
.hidden{display:none;}
.print-btn{
  float:right;
  margin-top:-30px;
}
@media print{
  body *{visibility:hidden;}
  #assigned-section, #assigned-section *{visibility:visible;}
  #assigned-section{position:absolute;top:0;left:0;width:100%;}
}
</style>
</head>

<body>

<header>
  <div style="display:flex;align-items:center;gap:12px;">
    <img src="logo.png.jpg" alt="Logo">
    <strong>Scheduler CRM</strong>
  </div>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a class="active">Assignments</a>
  </nav>
  <div class="logout" onclick="logout()">Logout</div>
</header>

<main>

<!-- FILTERS -->
<div class="filters">
  <select id="filterCity"><option value="">All Cities</option></select>
  <select id="filterSubject"><option value="">All Subjects</option></select>
  <select id="filterLevel"><option value="">All Levels</option></select>
</div>

<!-- VACANCIES -->
<div class="section-title">Open Vacancies</div>
<div class="grid" id="vacancyList"></div>

<!-- ASSIGNED -->
<div class="section-title">
  Assigned Today
  <button class="btn gray print-btn" onclick="window.print()">Print</button>
</div>
<div id="assigned-section" class="grid"></div>

</main>

<!-- ===== SCRIPTS ===== -->
<script src="js/places.js"></script>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";

/* ===== AUTH ===== */
if(!localStorage.getItem("scheduler_session")) logout();
function logout(){
  localStorage.clear();
  location.href="index.html";
}

/* ===== DATA ===== */
let vacancies=[], lecturers=[], assignments=[];

/* ===== INIT ===== */
loadFilters();
loadData();

/* ===== LOADERS ===== */
async function loadData(){
  vacancies = await fetchJSON("getVacancies");
  lecturers = await fetchJSON("getLecturers");
  assignments = await fetchJSON("getAssignments");
  renderVacancies();
  renderAssigned();
}

function loadFilters(){
  cities.forEach(c=>filterCity.add(new Option(c,c)));
  ["Physics","Chemistry","Biology","Maths","Other"].forEach(s=>filterSubject.add(new Option(s,s)));
  ["KCET","NEET","Boards","JEE","Foundation","Other"].forEach(l=>filterLevel.add(new Option(l,l)));
}

/* ===== FETCH ===== */
async function fetchJSON(action){
  const r = await fetch(`${SCRIPT_URL}?action=${action}`);
  return r.json();
}

/* ===== VACANCIES ===== */
function renderVacancies(){
  vacancyList.innerHTML="";
  vacancies.forEach(v=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <h4>${v.college}</h4>
      <span class="badge">${v.city}</span>
      <p>${v.subject} • ${v.level}</p>
      <p>₹${v.salaryFrom} – ₹${v.salaryTo}</p>
      <p>Faculty Needed: ${v.faculty}</p>
      <button class="btn green full" onclick="manualAssign('${v.id}')">Manual Assign</button>
      <button class="btn yellow full" onclick="autoAssign('${v.id}')">Auto Assign</button>
      <div id="assign-${v.id}" class="assign-box hidden"></div>
    `;
    vacancyList.appendChild(card);
  });
}

/* ===== MANUAL ===== */
function manualAssign(vacId){
  const box=document.getElementById("assign-"+vacId);
  box.classList.remove("hidden");
  const filtered=lecturers.filter(l=>l.status==="Active");
  box.innerHTML=filtered.map(l=>`
    <p>${l.name} (${l.city}) 
      <button class="btn green" onclick="assign('${vacId}','${l.id}')">Assign</button>
    </p>`).join("");
}

/* ===== AUTO ===== */
function autoAssign(vacId){
  const box=document.getElementById("assign-"+vacId);
  box.classList.remove("hidden");
  const top3=lecturers.filter(l=>l.status==="Active").slice(0,3);
  box.innerHTML=top3.map(l=>`
    <p>${l.name} 
      <button class="btn green" onclick="assign('${vacId}','${l.id}')">Assign</button>
    </p>`).join("");
}

/* ===== ASSIGN ===== */
async function assign(vacId,lecId){
  const salary=prompt("Agreed Salary?");
  if(!salary) return;
  await fetch(SCRIPT_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"addAssignment",
      vacancyId:vacId,
      lecturerId:lecId,
      agreedSalary:salary
    })
  });
  alert("Assigned");
  loadData();
}

/* ===== ASSIGNED ===== */
function renderAssigned(){
  assigned-section.innerHTML="";
  assignments.forEach(a=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <h4>${a.college}</h4>
      <p>${a.lecturer}</p>
      <p>₹${a.agreedSalary}</p>
      <button class="btn green" onclick="updateStatus('${a.id}','Selected')">Selected</button>
      <button class="btn gray" onclick="updateStatus('${a.id}','Rejected')">Not Selected</button>
    `;
    assigned-section.appendChild(card);
  });
}

/* ===== STATUS ===== */
async function updateStatus(id,status){
  await fetch(SCRIPT_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"updateAssignmentStatus",
      assignmentId:id,
      status:status
    })
  });
  loadData();
}
</script>
</body>
</html>
