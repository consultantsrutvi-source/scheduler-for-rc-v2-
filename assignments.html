<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scheduler CRM – Assignments</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --primary:#2563eb;
  --success:#16a34a;
  --danger:#dc2626;
  --muted:#64748b;
  --bg:#f8fafc;
  --card:#ffffff;
  --border:#e5e7eb;
}
*{box-sizing:border-box;font-family:Inter,system-ui,Arial}
body{margin:0;background:var(--bg);color:#0f172a}
header{
  background:#fff;
  border-bottom:1px solid var(--border);
  padding:14px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
header img{height:34px}
nav a{
  margin-left:18px;
  text-decoration:none;
  color:var(--muted);
  font-weight:500;
}
nav a.active{color:var(--primary)}
main{padding:24px;max-width:1300px;margin:auto}

h2{margin:6px 0 14px}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:16px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  transition:.25s;
}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.05)}

.badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}
.badge.open{background:#e0f2fe;color:#0369a1}
.badge.closed{background:#dcfce7;color:#166534}
.badge.assigned{background:#fef3c7;color:#92400e}
.badge.selected{background:#dcfce7;color:#166534}
.badge.rejected{background:#fee2e2;color:#991b1b}

.btn{
  padding:8px 14px;
  border-radius:8px;
  border:none;
  cursor:pointer;
  font-weight:600;
}
.btn.primary{background:var(--primary);color:#fff}
.btn.success{background:var(--success);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.secondary{background:#e5e7eb}
.btn.small{padding:6px 10px;font-size:12px}

select,input{
  width:100%;
  padding:8px;
  border-radius:8px;
  border:1px solid var(--border);
  margin:6px 0;
}

.section{margin-bottom:36px}

.fade-in{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
@media print{
  header,nav,.btn{display:none}
  body{background:#fff}
}
</style>
</head>

<body>
<header>
  <div style="display:flex;align-items:center;gap:12px">
    <img src="logo.png.jpg" alt="CRM">
    <strong>Scheduler CRM</strong>
  </div>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a class="active" href="#">Assignments</a>
  </nav>
</header>

<main>

<!-- OPEN VACANCIES -->
<section class="section">
<h2>Open Vacancies</h2>
<div id="vacancies" class="grid"></div>
</section>

<!-- ASSIGNED TODAY -->
<section class="section">
<h2>Assigned Today</h2>
<button class="btn secondary small" onclick="window.print()">Print</button>
<div id="assigned" class="grid"></div>
</section>

<!-- CLOSED VACANCIES -->
<section class="section">
<h2>Closed Vacancies History</h2>
<div id="closed" class="grid"></div>
</section>

</main>

<script>
const API="https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";

let VAC=[],LEC=[],ASN=[];

async function loadAll(){
  [VAC,LEC,ASN]=await Promise.all([
    fetch(API+"?action=getVacancies").then(r=>r.json()),
    fetch(API+"?action=getLecturers").then(r=>r.json()),
    fetch(API+"?action=getAssignments").then(r=>r.json())
  ]);
  render();
}

function render(){
  renderVacancies();
  renderAssigned();
  renderClosed();
}

function renderVacancies(){
  const el=document.getElementById("vacancies");
  el.innerHTML="";
  VAC.filter(v=>v.status==="Open").forEach(v=>{
    const used=ASN.filter(a=>a.vacancyId===v.id && a.status==="Selected").length;
    const remaining=Math.max(v.faculty-used,0);
    if(remaining===0) return;
    const c=document.createElement("div");
    c.className="card fade-in";
    c.innerHTML=`
      <span class="badge open">OPEN</span>
      <h3>${v.college}</h3>
      <div>${v.city} · ${v.subject}</div>
      <div><b>Faculty Required:</b> ${remaining}</div>

      <select id="lec-${v.id}">
        <option value="">Select Lecturer</option>
        ${LEC.filter(l=>l.subject===v.subject && l.status==="Active")
          .map(l=>`<option value="${l.id}|${l.name}">${l.name}</option>`).join("")}
      </select>

      <input id="sal-${v.id}" type="number" placeholder="Agreed Salary">

      <button class="btn primary" onclick="assign('${v.id}')">Assign</button>
    `;
    el.appendChild(c);
  });
}

async function assign(vacId){
  const sel=document.getElementById("lec-"+vacId);
  if(!sel.value) return alert("Select lecturer");
  const [lecId,lecName]=sel.value.split("|");
  const sal=document.getElementById("sal-"+vacId).value||0;
  const v=VAC.find(x=>x.id===vacId);

  const res=await fetch(API+"?action=addAssignment",{
    method:"POST",
    body:JSON.stringify({
      vacancyId:v.id,
      college:v.college,
      city:v.city,
      subject:v.subject,
      level:v.level,
      lecturerId:lecId,
      lecturerName:lecName,
      agreedSalary:sal
    })
  });
  const out=await res.json();
  if(!out.success) return alert("Failed");
  loadAll();
}

function renderAssigned(){
  const el=document.getElementById("assigned");
  el.innerHTML="";
  ASN.filter(a=>a.status==="Assigned").forEach(a=>{
    const c=document.createElement("div");
    c.className="card fade-in";
    c.innerHTML=`
      <span class="badge assigned">ASSIGNED</span>
      <h3>${a.lecturerName}</h3>
      <div>${a.subject}</div>
      <button class="btn success small" onclick="setStatus('${a.assignmentId}','Selected')">Selected</button>
      <button class="btn danger small" onclick="setStatus('${a.assignmentId}','Not Selected')">Not Selected</button>
    `;
    el.appendChild(c);
  });
}

async function setStatus(id,status){
  const res=await fetch(API+"?action=updateAssignmentStatus",{
    method:"POST",
    body:JSON.stringify({assignmentId:id,status})
  });
  const out=await res.json();
  if(!out.success) alert("Failed");
  loadAll();
}

function renderClosed(){
  const el=document.getElementById("closed");
  el.innerHTML="";
  VAC.filter(v=>{
    const selected=ASN.filter(a=>a.vacancyId===v.id && a.status==="Selected").length;
    return selected>=v.faculty;
  }).forEach(v=>{
    const c=document.createElement("div");
    c.className="card fade-in";
    c.innerHTML=`
      <span class="badge closed">CLOSED</span>
      <h3>${v.college}</h3>
      <div>${v.subject}</div>
    `;
    el.appendChild(c);
  });
}

loadAll();
</script>
</body>
</html>
