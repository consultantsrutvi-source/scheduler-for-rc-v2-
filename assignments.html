<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assignments | Scheduler CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- =========================================================
     GLOBAL STYLES – PREMIUM LIGHT CRM THEME
========================================================= -->
<style>

/* ---------------- ROOT COLORS ---------------- */
:root{
  --bg-main:#f6f9ff;
  --bg-card:#ffffff;
  --bg-soft:#eef4ff;
  --primary:#2563eb;
  --primary-light:#dbeafe;
  --success:#16a34a;
  --success-light:#dcfce7;
  --danger:#dc2626;
  --danger-light:#fee2e2;
  --warning:#d97706;
  --text-main:#0f172a;
  --text-muted:#64748b;
  --border:#e5e7eb;
  --shadow:0 12px 30px rgba(0,0,0,.08);
}

/* ---------------- RESET ---------------- */
*{
  box-sizing:border-box;
  font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont;
}

body{
  margin:0;
  background:var(--bg-main);
  color:var(--text-main);
}

/* ---------------- HEADER ---------------- */
header{
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px 26px;
  background:#fff;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:50;
}

header img{
  height:38px;
}

header strong{
  font-size:18px;
}

/* ---------------- NAV ---------------- */
nav{
  margin-left:auto;
  display:flex;
  gap:22px;
}

nav a{
  text-decoration:none;
  color:#334155;
  font-weight:500;
}

nav a.active{
  color:var(--primary);
  font-weight:600;
}

/* ---------------- MAIN ---------------- */
main{
  max-width:1300px;
  margin:auto;
  padding:26px;
}

/* ---------------- HEADINGS ---------------- */
h2{
  margin-top:38px;
  margin-bottom:16px;
  font-size:22px;
}

/* ---------------- GRID ---------------- */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:20px;
}

/* ---------------- CARD ---------------- */
.card{
  background:var(--bg-card);
  border-radius:18px;
  padding:18px;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
  animation:fadeIn .4s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

/* ---------------- BADGES ---------------- */
.badge{
  display:inline-block;
  padding:5px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}

.badge.open{
  background:var(--success-light);
  color:var(--success);
}

.badge.closed{
  background:var(--danger-light);
  color:var(--danger);
}

.badge.assigned{
  background:var(--primary-light);
  color:var(--primary);
}

/* ---------------- TEXT ---------------- */
.small{
  font-size:13px;
  color:var(--text-muted);
  margin-top:4px;
}

/* ---------------- BUTTONS ---------------- */
button{
  border:none;
  cursor:pointer;
  padding:9px 16px;
  border-radius:12px;
  font-weight:600;
}

button.primary{
  background:var(--primary);
  color:#fff;
}

button.success{
  background:var(--success);
  color:#fff;
}

button.danger{
  background:var(--danger);
  color:#fff;
}

button.soft{
  background:var(--bg-soft);
  color:var(--primary);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* ---------------- FORM ---------------- */
select{
  width:100%;
  padding:10px;
  border-radius:12px;
  border:1px solid var(--border);
  margin-top:10px;
}

/* ---------------- ROW ---------------- */
.row{
  display:flex;
  gap:10px;
  margin-top:12px;
  flex-wrap:wrap;
}

/* ---------------- TABLE ---------------- */
table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

th,td{
  padding:12px;
  border-bottom:1px solid var(--border);
  text-align:left;
}

th{
  background:#f1f5f9;
  font-weight:600;
}

tr:last-child td{
  border-bottom:none;
}

/* ---------------- PRINT ---------------- */
@media print{
  header,nav,button{display:none!important}
  body{background:#fff}
}

</style>
</head>

<body>

<!-- =========================================================
     HEADER
========================================================= -->
<header>
  <img src="logo.png.jpg" alt="CRM Logo">
  <strong>Scheduler CRM</strong>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a class="active">Assignments</a>
  </nav>
</header>

<!-- =========================================================
     MAIN CONTENT
========================================================= -->
<main>

<!-- ================= OPEN VACANCIES ================= -->
<h2>Open Vacancies</h2>
<div id="openVacancies" class="grid"></div>

<!-- ================= ASSIGNED TODAY ================= -->
<h2>Assigned Today</h2>
<button class="soft" onclick="window.print()">Print</button>

<table>
<thead>
<tr>
  <th>College</th>
  <th>Subject</th>
  <th>Lecturer</th>
  <th>Status</th>
  <th>Action</th>
</tr>
</thead>
<tbody id="assignedToday"></tbody>
</table>

<!-- ================= CLOSED HISTORY ================= -->
<h2>Closed Vacancies History</h2>
<table>
<thead>
<tr>
  <th>College</th>
  <th>Subject</th>
  <th>Selected Lecturers</th>
  <th>Closed At</th>
</tr>
</thead>
<tbody id="closedHistory"></tbody>
</table>

</main>

<!-- =========================================================
     SCRIPT – STRICT BACKEND MATCH
========================================================= -->
<script>

/* =========================================================
   API CONFIG
========================================================= */
const API_URL =
"https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";

/* =========================================================
   GLOBAL STATE (CACHED FOR SPEED)
========================================================= */
let VACANCIES = [];
let LECTURERS = [];
let ASSIGNMENTS = [];

/* =========================================================
   INIT
========================================================= */
document.addEventListener("DOMContentLoaded", init);

async function init(){
  await loadAll();
  renderAll();
}

/* =========================================================
   LOAD DATA (SINGLE FETCH ROUND)
========================================================= */
async function loadAll(){
  const [v,l,a] = await Promise.all([
    fetch(API_URL+"?action=getVacancies").then(r=>r.json()),
    fetch(API_URL+"?action=getLecturers").then(r=>r.json()),
    fetch(API_URL+"?action=getAssignments").then(r=>r.json())
  ]);

  VACANCIES = v || [];
  LECTURERS = l || [];
  ASSIGNMENTS = a || [];
}

/* =========================================================
   RENDER ALL
========================================================= */
function renderAll(){
  renderOpenVacancies();
  renderAssignedToday();
  renderClosedHistory();
}

/* =========================================================
   OPEN VACANCIES (FACULTY > 0 ONLY)
========================================================= */
function renderOpenVacancies(){
  const wrap = document.getElementById("openVacancies");
  wrap.innerHTML = "";

  VACANCIES
  .filter(v => v.status === "Open" && Number(v.faculty) > 0)
  .forEach(v => {

    const card = document.createElement("div");
    card.className = "card";

    const matchedLecturers = LECTURERS.filter(l =>
      l.subject === v.subject && l.status === "Active"
    );

    card.innerHTML = `
      <span class="badge open">OPEN</span>
      <h3>${v.college}</h3>
      <div class="small">${v.city} • ${v.subject}</div>
      <div class="small">Faculty Required: <b>${v.faculty}</b></div>

      <select id="lect-${v.id}">
        <option value="">Select Lecturer</option>
        ${matchedLecturers.map(l =>
          `<option value="${l.id}|${l.name}">${l.name}</option>`
        ).join("")}
      </select>

      <div class="row">
        <button class="primary" onclick="assign('${v.id}')">Assign</button>
      </div>
    `;

    wrap.appendChild(card);
  });
}

/* =========================================================
   ASSIGN LECTURER (MANUAL ONLY)
========================================================= */
async function assign(vacancyId){
  const sel = document.getElementById("lect-"+vacancyId);
  if(!sel || !sel.value){
    alert("Please select a lecturer");
    return;
  }

  const [lecturerId, lecturerName] = sel.value.split("|");

  await fetch(API_URL+"?action=addAssignment",{
    method:"POST",
    body:JSON.stringify({
      vacancyId,
      lecturerId,
      lecturerName,
      agreedSalary:0
    })
  });

  await loadAll();
  renderAll();
}

/* =========================================================
   ASSIGNED TODAY (STATUS TOGGLE)
========================================================= */
function renderAssignedToday(){
  const tbody = document.getElementById("assignedToday");
  tbody.innerHTML = "";

  ASSIGNMENTS
  .filter(a => a.status === "Assigned")
  .forEach(a => {

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${a.college}</td>
      <td>${a.subject}</td>
      <td>${a.lecturerName}</td>
      <td><span class="badge assigned">Assigned</span></td>
      <td>
        <button class="success" onclick="updateStatus('${a.assignmentId}','Selected')">Selected</button>
        <button class="danger" onclick="updateStatus('${a.assignmentId}','Not Selected')">Not Selected</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

/* =========================================================
   UPDATE ASSIGNMENT STATUS
========================================================= */
async function updateStatus(id,status){
  await fetch(API_URL+"?action=updateAssignmentStatus",{
    method:"POST",
    body:JSON.stringify({
      assignmentId:id,
      status
    })
  });

  await loadAll();
  renderAll();
}

/* =========================================================
   CLOSED VACANCIES HISTORY
========================================================= */
function renderClosedHistory(){
  const tbody = document.getElementById("closedHistory");
  tbody.innerHTML = "";

  VACANCIES
  .filter(v => v.status !== "Open")
  .forEach(v => {

    const selectedLects = ASSIGNMENTS
      .filter(a => a.vacancyId === v.id && a.status === "Selected")
      .map(a => a.lecturerName)
      .join(", ");

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${v.college}</td>
      <td>${v.subject}</td>
      <td>${selectedLects}</td>
      <td>${new Date(v.updatedAt || "").toLocaleString()}</td>
    `;
    tbody.appendChild(tr);
  });
}

</script>
<script>
/* =========================================================
   🔧 PATCH START – ASSIGNMENT & VACANCY FIXES
========================================================= */

/* ---------- UI FEEDBACK ---------- */
function setBtnState(btn, text, disabled=true){
  btn.dataset.oldText = btn.innerText;
  btn.innerText = text;
  btn.disabled = disabled;
}
function restoreBtn(btn){
  btn.innerText = btn.dataset.oldText || "Assign";
  btn.disabled = false;
}

/* ---------- SAFE FINDERS ---------- */
function getVacancyById(id){
  return VACANCIES.find(v => v.id === id);
}
function getAssignmentsByVacancy(id){
  return ASSIGNMENTS.filter(a => a.vacancyId === id);
}

/* ---------- OVERRIDE ASSIGN FUNCTION ---------- */
async function assign(vacancyId){
  const select = document.getElementById("lect-"+vacancyId);
  if(!select || !select.value){
    alert("Select a lecturer first");
    return;
  }

  const btn = select.closest(".card").querySelector("button");
  setBtnState(btn,"Saving…");

  const [lecturerId, lecturerName] = select.value.split("|");
  const vacancy = getVacancyById(vacancyId);

  /* ❌ Prevent duplicate lecturer for same vacancy */
  if(
    ASSIGNMENTS.some(a =>
      a.vacancyId === vacancyId &&
      a.lecturerId === lecturerId &&
      a.status === "Assigned"
    )
  ){
    alert("This lecturer is already assigned to this vacancy");
    restoreBtn(btn);
    return;
  }

  /* ✅ FULL DATA PAYLOAD (FIXES EMPTY ROW BUG) */
  const payload = {
    vacancyId: vacancy.id,
    college: vacancy.college,
    city: vacancy.city,
    subject: vacancy.subject,
    level: vacancy.level,
    lecturerId,
    lecturerName,
    agreedSalary: 0,
    assignmentType: "Manual"
  };

  await fetch(API_URL+"?action=addAssignment",{
    method:"POST",
    body: JSON.stringify(payload)
  });

  /* ---------- DECREMENT FACULTY REQUIRED ---------- */
  vacancy.faculty = Number(vacancy.faculty) - 1;

  /* ---------- AUTO CLOSE VACANCY ---------- */
  if(vacancy.faculty <= 0){
    vacancy.status = "Closed";
  }

  /* ---------- REFRESH STATE ---------- */
  await loadAll();
  renderAll();

  restoreBtn(btn);
}

/* ---------- FIX ASSIGNED TODAY RENDER ---------- */
function renderAssignedToday(){
  const tbody = document.getElementById("assignedToday");
  tbody.innerHTML = "";

  ASSIGNMENTS
    .filter(a => a.status === "Assigned")
    .forEach(a => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${a.college || "-"}</td>
        <td>${a.subject || "-"}</td>
        <td>${a.lecturerName}</td>
        <td><span class="badge assigned">Assigned</span></td>
        <td>
          <button class="success" onclick="updateStatus('${a.assignmentId}','Selected')">Selected</button>
          <button class="danger" onclick="updateStatus('${a.assignmentId}','Not Selected')">Not Selected</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
}

/* ---------- STATUS TOGGLE FIX ---------- */
async function updateStatus(assignmentId,status){
  await fetch(API_URL+"?action=updateAssignmentStatus",{
    method:"POST",
    body: JSON.stringify({ assignmentId, status })
  });

  /* 🔁 If NOT SELECTED → restore vacancy */
  if(status === "Not Selected"){
    const a = ASSIGNMENTS.find(x => x.assignmentId === assignmentId);
    if(a){
      const v = getVacancyById(a.vacancyId);
      if(v){
        v.faculty = Number(v.faculty) + 1;
        v.status = "Open";
      }
    }
  }

  await loadAll();
  renderAll();
}

/* ---------- OPEN VACANCY FILTER FIX ---------- */
function renderOpenVacancies(){
  const wrap = document.getElementById("openVacancies");
  wrap.innerHTML = "";

  VACANCIES
    .filter(v => v.status === "Open" && Number(v.faculty) > 0)
    .forEach(v => {
      const card = document.createElement("div");
      card.className = "card";

      const matches = LECTURERS.filter(l =>
        l.subject === v.subject && l.status === "Active"
      );

      card.innerHTML = `
        <span class="badge open">OPEN</span>
        <h3>${v.college}</h3>
        <div class="small">${v.city} • ${v.subject}</div>
        <div class="small">Faculty Required: <b>${v.faculty}</b></div>

        <select id="lect-${v.id}">
          <option value="">Select Lecturer</option>
          ${matches.map(l =>
            `<option value="${l.id}|${l.name}">${l.name}</option>`
          ).join("")}
        </select>

        <div class="row">
          <button class="primary" onclick="assign('${v.id}')">Assign</button>
        </div>
      `;
      wrap.appendChild(card);
    });
}

/* =========================================================
   🔧 PATCH END
========================================================= */
</script>

</body>
</html>
