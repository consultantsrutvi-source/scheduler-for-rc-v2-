<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assignments | Scheduler CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --primary:#2563eb;
  --success:#16a34a;
  --danger:#dc2626;
  --muted:#64748b;
  --border:#e5e7eb;
}
*{box-sizing:border-box;font-family:Inter,system-ui}
body{margin:0;background:var(--bg);color:#0f172a}
header{
  display:flex;align-items:center;gap:12px;
  padding:14px 22px;background:#fff;border-bottom:1px solid var(--border)
}
header img{height:36px}
nav{margin-left:auto;display:flex;gap:18px}
nav a{text-decoration:none;color:#334155;font-weight:500}
nav a.active{color:var(--primary)}
main{padding:24px;max-width:1200px;margin:auto}
h2{margin-top:34px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:16px;
  box-shadow:0 6px 20px rgba(0,0,0,.05)
}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px}
.open{background:#dcfce7;color:#166534}
.closed{background:#fee2e2;color:#991b1b}
button{
  background:var(--primary);color:#fff;border:none;
  padding:8px 14px;border-radius:10px;cursor:pointer
}
button.secondary{background:#e5e7eb;color:#111}
select{width:100%;padding:8px;border-radius:10px;border:1px solid var(--border)}
.row{display:flex;gap:10px;margin-top:10px}
.small{font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left}
th{background:#f1f5f9}
@media print{
  nav,button{display:none}
  body{background:#fff}
}
</style>
</head>

<body>

<header>
  <img src="logo.png.jpg" alt="CRM">
  <strong>Scheduler CRM</strong>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a class="active">Assignments</a>
  </nav>
</header>

<main>

<h2>Open Vacancies</h2>
<div id="vacancies" class="grid"></div>

<h2>Assigned Today</h2>
<button onclick="window.print()">Print</button>
<table id="assignedTable">
<thead>
<tr>
<th>Vacancy</th><th>Lecturer</th><th>Status</th><th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>

<h2>Closed Vacancies History</h2>
<table id="closedTable">
<thead>
<tr>
<th>College</th><th>Subject</th><th>Lecturers</th><th>Closed At</th>
</tr>
</thead>
<tbody></tbody>
</table>

</main>

<script>
const API="https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";

let vacancies=[], lecturers=[], assignments=[];

async function loadAll(){
  const [v,l,a]=await Promise.all([
    fetch(API+"?action=getVacancies").then(r=>r.json()),
    fetch(API+"?action=getLecturers").then(r=>r.json()),
    fetch(API+"?action=getAssignments").then(r=>r.json())
  ]);
  vacancies=v; lecturers=l; assignments=a;
  render();
}

function render(){
  renderVacancies();
  renderAssigned();
  renderClosed();
}

function renderVacancies(){
  const el=document.getElementById("vacancies");
  el.innerHTML="";
  vacancies.filter(v=>v.status==="Open" && v.faculty>0).forEach(v=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <span class="badge open">OPEN</span>
      <h3>${v.college}</h3>
      <div class="small">${v.city} • ${v.subject}</div>
      <div class="small">Faculty Required: <b>${v.faculty}</b></div>
      <select id="sel-${v.id}">
        <option value="">Select Lecturer</option>
        ${lecturers.filter(l=>l.subject===v.subject && l.status==="Active")
          .map(l=>`<option value="${l.id}|${l.name}">${l.name}</option>`).join("")}
      </select>
      <div class="row">
        <button onclick="assign('${v.id}')">Assign</button>
      </div>
    `;
    el.appendChild(card);
  });
}

async function assign(vacId){
  const sel=document.getElementById("sel-"+vacId);
  if(!sel.value)return alert("Select lecturer");
  const [lid,lname]=sel.value.split("|");
  await fetch(API+"?action=addAssignment",{method:"POST",
    body:JSON.stringify({
      vacancyId:vacId,
      lecturerId:lid,
      lecturerName:lname,
      agreedSalary:0
    })
  });
  await loadAll();
}

function renderAssigned(){
  const tb=document.querySelector("#assignedTable tbody");
  tb.innerHTML="";
  assignments.filter(a=>a.status==="Assigned").forEach(a=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${a.college}</td>
      <td>${a.lecturerName}</td>
      <td><span class="badge open">Assigned</span></td>
      <td>
        <button onclick="mark('${a.assignmentId}','Selected')">Selected</button>
        <button class="secondary" onclick="mark('${a.assignmentId}','Not Selected')">Not Selected</button>
      </td>
    `;
    tb.appendChild(tr);
  });
}

async function mark(id,status){
  await fetch(API+"?action=updateAssignmentStatus",{method:"POST",
    body:JSON.stringify({assignmentId:id,status})
  });
  await loadAll();
}

function renderClosed(){
  const tb=document.querySelector("#closedTable tbody");
  tb.innerHTML="";
  vacancies.filter(v=>v.status!=="Open").forEach(v=>{
    const lects=assignments.filter(a=>a.vacancyId===v.id && a.status==="Selected")
      .map(a=>a.lecturerName).join(", ");
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${v.college}</td>
      <td>${v.subject}</td>
      <td>${lects}</td>
      <td>${new Date(v.updatedAt||"").toLocaleString()}</td>
    `;
    tb.appendChild(tr);
  });
}

loadAll();
</script>

</body>
</html>
