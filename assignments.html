<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assignments | Scheduler CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#f5f8ff;
  --card:#ffffff;
  --primary:#2563eb;
  --success:#16a34a;
  --danger:#dc2626;
  --muted:#64748b;
  --border:#e5e7eb;
  --shadow:0 10px 25px rgba(0,0,0,.08);
}

*{box-sizing:border-box;font-family:Inter,system-ui}

body{margin:0;background:var(--bg)}

header{
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px 24px;
  background:#fff;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:10;
}

header img{height:38px}
header strong{font-size:18px}

nav{margin-left:auto;display:flex;gap:18px}
nav a{text-decoration:none;color:#334155;font-weight:500}
nav a.active{color:var(--primary);font-weight:600}

main{max-width:1300px;margin:auto;padding:26px}

h2{margin:30px 0 14px}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:20px;
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:18px;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
}

.small{font-size:13px;color:var(--muted);margin-top:4px}

.badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}
.open{background:#dcfce7;color:#166534}
.closed{background:#fee2e2;color:#991b1b}
.assigned{background:#dbeafe;color:#1e40af}

select,button{
  width:100%;
  padding:10px;
  border-radius:12px;
  border:1px solid var(--border);
  margin-top:10px;
}

button{
  cursor:pointer;
  font-weight:600;
  background:var(--primary);
  color:#fff;
  border:none;
}

button.success{background:var(--success)}
button.danger{background:var(--danger)}
button:disabled{opacity:.6}

.row{display:flex;gap:10px;margin-top:12px}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

th,td{
  padding:12px;
  border-bottom:1px solid var(--border);
  text-align:left;
}

th{background:#f1f5f9}

@media print{
  header,nav,button,select{display:none}
  body{background:#fff}
}
</style>
</head>

<body>

<header>
  <img src="logo.png.jpg">
  <strong>Scheduler CRM</strong>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a class="active">Assignments</a>
  </nav>
</header>

<main>

<h2>Open Vacancies</h2>
<div id="openVacancies" class="grid"></div>

<h2>Assigned Today</h2>
<button onclick="window.print()">Print</button>

<table>
<thead>
<tr>
  <th>College</th>
  <th>Subject</th>
  <th>Lecturer</th>
  <th>Status</th>
  <th>Action</th>
</tr>
</thead>
<tbody id="assignedToday"></tbody>
</table>

<h2>Closed Vacancies</h2>
<table>
<thead>
<tr>
  <th>College</th>
  <th>Subject</th>
  <th>Selected Lecturers</th>
  <th>Closed At</th>
</tr>
</thead>
<tbody id="closedHistory"></tbody>
</table>

</main>

<script>
const API =
"https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";

let VACANCIES=[],LECTURERS=[],ASSIGNMENTS=[];

document.addEventListener("DOMContentLoaded",loadAll);

async function loadAll(){
  const [v,l,a]=await Promise.all([
    fetch(API+"?action=getVacancies").then(r=>r.json()),
    fetch(API+"?action=getLecturers").then(r=>r.json()),
    fetch(API+"?action=getAssignments").then(r=>r.json())
  ]);
  VACANCIES=v||[];
  LECTURERS=l||[];
  ASSIGNMENTS=a||[];
  render();
}

function render(){
  renderOpen();
  renderAssigned();
  renderClosed();
}

function renderOpen(){
  const wrap=document.getElementById("openVacancies");
  wrap.innerHTML="";
  VACANCIES.filter(v=>v.status==="Open"&&Number(v.faculty)>0).forEach(v=>{
    const opts=LECTURERS.filter(l=>l.subject===v.subject&&l.status==="Active");
    const d=document.createElement("div");
    d.className="card";
    d.innerHTML=`
      <span class="badge open">OPEN</span>
      <h3>${v.college}</h3>
      <div class="small">${v.city} • ${v.subject}</div>
      <div class="small">Faculty Required: <b>${v.faculty}</b></div>
      <select id="lect-${v.id}">
        <option value="">Select Lecturer</option>
        ${opts.map(o=>`<option value="${o.id}|${o.name}">${o.name}</option>`).join("")}
      </select>
      <button onclick="assign('${v.id}',this)">Assign</button>
    `;
    wrap.appendChild(d);
  });
}

async function assign(vacId,btn){
  const sel=document.getElementById("lect-"+vacId);
  if(!sel||!sel.value){alert("Select lecturer");return;}
  btn.disabled=true;

  const [lid,lname]=sel.value.split("|");
  const v=VACANCIES.find(x=>x.id===vacId);

  const payload={
    vacancyId:v.id,
    college:v.college,
    city:v.city,
    subject:v.subject,
    level:v.level,
    lecturerId:lid,
    lecturerName:lname,
    agreedSalary:0,
    assignmentType:"Manual"
  };

  const res=await fetch(API+"?action=addAssignment",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)
  });
  const data=await res.json();
  if(!data.success){alert("Failed");btn.disabled=false;return;}

  await loadAll();
}

function renderAssigned(){
  const t=document.getElementById("assignedToday");
  t.innerHTML="";
  ASSIGNMENTS.filter(a=>a.status==="Assigned").forEach(a=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${a.college}</td>
      <td>${a.subject}</td>
      <td>${a.lecturerName}</td>
      <td><span class="badge assigned">Assigned</span></td>
      <td>
        <button class="success" onclick="updateStatus('${a.assignmentId}','Selected')">Selected</button>
        <button class="danger" onclick="updateStatus('${a.assignmentId}','Not Selected')">Not Selected</button>
      </td>
    `;
    t.appendChild(tr);
  });
}

async function updateStatus(id,status){
  await fetch(API+"?action=updateAssignmentStatus",{
    method:"POST",
    body:JSON.stringify({assignmentId:id,status})
  });
  await loadAll();
}

function renderClosed(){
  const t=document.getElementById("closedHistory");
  t.innerHTML="";
  VACANCIES.filter(v=>v.status!=="Open").forEach(v=>{
    const sel=ASSIGNMENTS.filter(a=>a.vacancyId===v.id&&a.status==="Selected")
      .map(a=>a.lecturerName).join(", ");
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${v.college}</td>
      <td>${v.subject}</td>
      <td>${sel}</td>
      <td>${v.updatedAt||""}</td>
    `;
    t.appendChild(tr);
  });
}
</script>

</body>
</html>
