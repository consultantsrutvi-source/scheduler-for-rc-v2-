<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Assignments | Scheduler CRM</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{margin:0;font-family:Inter,system-ui;background:#f4f7fb}
header{background:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #ddd}
header img{height:36px;border-radius:8px}
nav{margin-left:auto;display:flex;gap:18px}
nav a{text-decoration:none;color:#334;font-weight:500}
main{max-width:1300px;margin:auto;padding:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.badge{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600}
.open{background:#dcfce7;color:#166534}
button{border:none;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.primary{background:#2563eb;color:#fff}
.success{background:#16a34a;color:#fff}
.danger{background:#dc2626;color:#fff}
select{width:100%;padding:10px;border-radius:10px;margin-top:8px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}
th{background:#f1f5f9}
@media print{header,button{display:none}}
</style>
</head>

<body>
<header>
  <img src="logo.png.jpg">
  <strong>Scheduler CRM</strong>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a style="color:#2563eb;font-weight:700">Assignments</a>
  </nav>
</header>

<main>
<h2>Open Vacancies</h2>
<div id="vacancyCards" class="grid"></div>

<h2>Assigned Today</h2>
<button onclick="window.print()">Print</button>
<table>
<thead>
<tr><th>College</th><th>Subject</th><th>Lecturer</th><th>Status</th><th>Action</th></tr>
</thead>
<tbody id="todayBody"></tbody>
</table>
</main>

<script>
const CORE_API = "https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";
const ASSIGN_API = "https://script.google.com/macros/s/AKfycbzzyHnG5DX0-nXMNWVgP-l5xENYA7yAln5TowtGa3FxeTdJmyyt0XO5h0Zc8uW2LLI_0Q/exec";

let vacancies=[],lecturers=[],assignments=[];

init();
async function init(){
  [vacancies,lecturers,assignments] = await Promise.all([
    fetch(CORE_API+"?action=getVacancies").then(r=>r.json()),
    fetch(CORE_API+"?action=getLecturers").then(r=>r.json()),
    fetch(ASSIGN_API+"?action=getAssignments").then(r=>r.json())
  ]);
  render();
}

function render(){
  renderVacancies();
  renderToday();
}

function renderVacancies(){
  const box=document.getElementById("vacancyCards");
  box.innerHTML="";
  vacancies.filter(v=>v.status==="Open"&&v.faculty>0).forEach(v=>{
    const opts=lecturers.filter(l=>l.subject===v.subject&&l.status==="Active");
    const c=document.createElement("div");
    c.className="card";
    c.innerHTML=`
      <span class="badge open">OPEN</span>
      <h3>${v.college}</h3>
      <div>${v.city} • ${v.subject}</div>
      <div>Faculty Required: <b>${v.faculty}</b></div>
      <select id="sel-${v.id}">
        <option value="">Select Lecturer</option>
        ${opts.map(l=>`<option value="${l.id}|${l.name}">${l.name}</option>`).join("")}
      </select>
      <button class="primary" onclick="assign('${v.id}')">Assign</button>
    `;
    box.appendChild(c);
  });
}

async function assign(vId){
  const sel=document.getElementById("sel-"+vId);
  if(!sel.value)return alert("Select lecturer");
  const [lid,lname]=sel.value.split("|");
  const v=vacancies.find(x=>x.id===vId);

  const res=await fetch(ASSIGN_API+"?action=addAssignment",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      vacancyId:v.id,
      college:v.college,
      city:v.city,
      subject:v.subject,
      level:v.level,
      lecturerId:lid,
      lecturerName:lname,
      agreedSalary:0
    })
  });
  const j=await res.json();
  if(!j.success)return alert("Failed");

  v.faculty--;
  if(v.faculty<=0)v.status="Closed";

  init();
}

function renderToday(){
  const tb=document.getElementById("todayBody");
  tb.innerHTML="";
  assignments.filter(a=>a.assignmentStatus==="Assigned").forEach(a=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${a.college}</td>
      <td>${a.subject}</td>
      <td>${a.lecturerName}</td>
      <td>Assigned</td>
      <td>
        <button class="success" onclick="update('${a.assignmentId}','Selected')">Selected</button>
        <button class="danger" onclick="update('${a.assignmentId}','Not Selected')">Not Selected</button>
      </td>
    `;
    tb.appendChild(tr);
  });
}

async function update(id,status){
  await fetch(ASSIGN_API+"?action=updateAssignmentStatus",{
    method:"POST",
    body:JSON.stringify({assignmentId:id,status})
  });
  init();
}
</script>
</body>
</html>
