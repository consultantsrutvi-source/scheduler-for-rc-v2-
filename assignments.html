<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Assignments | Scheduler CRM</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#f6f8fb;
  --card:#ffffff;
  --primary:#2563eb;
  --accent:#22c55e;
  --danger:#ef4444;
  --text:#1f2937;
  --muted:#6b7280;
  --border:#e5e7eb;
  --shadow:0 10px 30px rgba(0,0,0,.06);
}

*{box-sizing:border-box;font-family:Inter,system-ui,Arial}
body{margin:0;background:var(--bg);color:var(--text)}

header{
  background:#fff;
  padding:14px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}
.logo img{
  width:36px;height:36px;
}
.logo span{
  font-weight:700;
  font-size:18px;
}

nav a{
  margin-left:20px;
  text-decoration:none;
  color:var(--muted);
  font-weight:500;
}
nav a.active{color:var(--primary)}

main{padding:24px;max-width:1300px;margin:auto}

h2{margin:0 0 12px 0}

.section{
  margin-bottom:32px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:20px;
}

.card{
  background:var(--card);
  border-radius:14px;
  padding:18px;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
  display:flex;
  flex-direction:column;
  gap:10px;
}

.card h3{margin:0;font-size:16px}
.meta{font-size:13px;color:var(--muted)}
.badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}
.badge.open{background:#ecfeff;color:#0369a1}
.badge.closed{background:#fef2f2;color:#991b1b}

.actions{
  margin-top:auto;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
button{
  border:none;
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}
.primary{background:var(--primary);color:#fff}
.success{background:var(--accent);color:#fff}
.danger{background:var(--danger);color:#fff}
.ghost{background:#f3f4f6}

select,input{
  width:100%;
  padding:8px;
  border-radius:8px;
  border:1px solid var(--border);
}

.toggle{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:16px;
}

.hidden{display:none}

.print-btn{
  background:#111827;
  color:#fff;
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="logo.png" onerror="this.src='https://dummyimage.com/72x72/2563eb/ffffff&text=CRM'">
    <span>Scheduler CRM</span>
  </div>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a class="active">Assignments</a>
  </nav>
</header>

<main>

<section class="section">
  <h2>Open Vacancies</h2>
  <div id="vacancyGrid" class="grid"></div>
</section>

<section class="section">
  <h2>Assigned Today</h2>
  <div id="assignedGrid" class="grid"></div>
</section>

<section class="section">
  <div class="toggle">
    <button class="ghost" onclick="toggleClosed()">Show / Hide Closed Vacancies</button>
  </div>
  <div id="closedSection" class="hidden">
    <h2>Closed Vacancies</h2>
    <div id="closedGrid" class="grid"></div>
  </div>
</section>

</main>

<script>
const API = "https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";

let vacancies=[], lecturers=[], assignments=[];

const qs = a => document.querySelector(a);

async function loadAll(){
  [vacancies,lecturers,assignments] = await Promise.all([
    fetch(API+"?action=getVacancies").then(r=>r.json()),
    fetch(API+"?action=getLecturers").then(r=>r.json()),
    fetch(API+"?action=getAssignments").then(r=>r.json())
  ]);
  renderAll();
}

function renderAll(){
  renderVacancies();
  renderAssignments();
  renderClosed();
}

function renderVacancies(){
  const g = qs("#vacancyGrid");
  g.innerHTML="";
  vacancies.filter(v=>v.status==="Open").forEach(v=>{
    const c=document.createElement("div");
    c.className="card";
    c.innerHTML=`
      <span class="badge open">OPEN</span>
      <h3>${v.college}</h3>
      <div class="meta">${v.city} • ${v.subject}</div>
      <div class="meta">Faculty Required: <b>${v.faculty}</b></div>
      <div class="meta">${v.notes||""}</div>
      <div class="actions">
        <button class="primary" onclick="openAssign('${v.id}')">Assign Lecturer</button>
      </div>
    `;
    g.appendChild(c);
  });
}

function openAssign(vacancyId){
  const v = vacancies.find(x=>x.id===vacancyId);
  if(!v) return;

  const matches = lecturers.filter(l=>l.subject===v.subject && l.status==="Active");
  if(!matches.length){alert("No matching lecturers");return;}

  const name = prompt(
    "Select Lecturer:\n"+
    matches.map((l,i)=>`${i+1}. ${l.name}`).join("\n")
  );
  const idx = parseInt(name)-1;
  if(!matches[idx]) return;

  addAssignment(v,matches[idx]);
}

async function addAssignment(v,l){
  await fetch(API+"?action=addAssignment",{
    method:"POST",
    body:JSON.stringify({
      vacancyId:v.id,
      college:v.college,
      city:v.city,
      subject:v.subject,
      level:v.level,
      lecturerId:l.id,
      lecturerName:l.name,
      agreedSalary:0,
      assignmentType:"Manual"
    })
  });

  v.faculty--;
  if(v.faculty<=0) v.status="Closed";

  assignments.push({
    vacancyId:v.id,
    college:v.college,
    lecturerName:l.name,
    status:"Assigned",
    subject:v.subject
  });

  renderAll();
}

function renderAssignments(){
  const g=qs("#assignedGrid");
  g.innerHTML="";
  assignments.filter(a=>a.status==="Assigned").forEach(a=>{
    const c=document.createElement("div");
    c.className="card";
    c.innerHTML=`
      <h3>${a.college}</h3>
      <div class="meta">${a.subject} • ${a.lecturerName}</div>
      <div class="actions">
        <button class="success" onclick="markSelected('${a.assignmentId}')">Selected</button>
        <button class="danger" onclick="markRejected('${a.assignmentId}')">Not Selected</button>
      </div>
    `;
    g.appendChild(c);
  });
}

async function markSelected(id){
  await fetch(API+"?action=updateAssignmentStatus",{
    method:"POST",
    body:JSON.stringify({assignmentId:id,status:"Selected"})
  });
  assignments.find(a=>a.assignmentId===id).status="Selected";
  renderAll();
}

async function markRejected(id){
  await fetch(API+"?action=updateAssignmentStatus",{
    method:"POST",
    body:JSON.stringify({assignmentId:id,status:"Not Selected"})
  });
  assignments.find(a=>a.assignmentId===id).status="Not Selected";
  renderAll();
}

function renderClosed(){
  const g=qs("#closedGrid");
  g.innerHTML="";
  vacancies.filter(v=>v.status==="Closed").forEach(v=>{
    const c=document.createElement("div");
    c.className="card";
    c.innerHTML=`
      <span class="badge closed">CLOSED</span>
      <h3>${v.college}</h3>
      <div class="meta">${v.subject}</div>
      <div class="actions">
        <button class="print-btn" onclick="window.print()">Print</button>
      </div>
    `;
    g.appendChild(c);
  });
}

function toggleClosed(){
  qs("#closedSection").classList.toggle("hidden");
}

loadAll();
</script>

</body>
</html>
