<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Assignments | Scheduler CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- ================== STYLE ================== -->
<style>
:root{
  --bg:#0f172a;
  --card:#ffffffee;
  --accent:#4f46e5;
  --accent2:#06b6d4;
  --success:#16a34a;
  --danger:#dc2626;
  --text:#0f172a;
}

*{box-sizing:border-box;font-family:Inter,system-ui,Arial}
body{
  margin:0;
  background:linear-gradient(135deg,#0f172a,#020617);
  min-height:100vh;
}

/* HEADER */
header{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  padding:14px 28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#fff;
}
header .logo{
  display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px;
}
header nav a{
  color:#fff;text-decoration:none;margin:0 14px;font-weight:500;
}
header nav a.active{border-bottom:2px solid #fff;padding-bottom:4px}
.logout{
  background:#ef4444;border:none;color:#fff;
  padding:8px 14px;border-radius:10px;cursor:pointer;
}

/* LAYOUT */
.container{
  padding:26px;
  max-width:1400px;
  margin:auto;
}

/* FILTER BAR */
.filters{
  background:var(--card);
  border-radius:16px;
  padding:18px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:14px;
  margin-bottom:22px;
}
.filters select{
  padding:10px;border-radius:10px;border:1px solid #ccc;
}

/* SECTION */
.section-title{
  color:#fff;font-size:20px;margin:22px 0 12px;
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:18px;
}
.card{
  background:var(--card);
  border-radius:18px;
  padding:18px;
  box-shadow:0 20px 40px rgba(0,0,0,.25);
}
.card h3{margin:0 0 6px;color:var(--text)}
.card p{margin:4px 0;font-size:14px}

/* BUTTONS */
.btn{
  padding:10px 14px;border:none;border-radius:12px;
  cursor:pointer;font-weight:600;
}
.btn.primary{background:var(--accent);color:#fff}
.btn.auto{background:var(--accent2);color:#fff}
.btn.success{background:var(--success);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.small{padding:6px 10px;font-size:13px}

/* LECTURER LIST */
.lecturer{
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
  margin-top:10px;
}
.lecturer strong{display:block}

/* ASSIGNED */
.assigned{
  border-left:6px solid var(--success);
}

/* PRINT */
@media print{
  body{background:#fff}
  header,.filters,.btn{display:none}
  .card{box-shadow:none;border:1px solid #ccc}
}
</style>
</head>

<body>

<header>
  <div class="logo">Scheduler CRM</div>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a href="assignments.html" class="active">Assignments</a>
  </nav>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

  <!-- FILTERS -->
  <div class="filters">
    <select id="filterCity"><option value="">All Cities</option></select>
    <select id="filterSubject"><option value="">All Subjects</option></select>
    <select id="filterLevel"><option value="">All Levels</option></select>
    <button class="btn primary" onclick="loadVacancies()">Refresh</button>
    <button class="btn small" onclick="window.print()">Print</button>
  </div>

  <!-- VACANCIES -->
  <div class="section-title">Open Vacancies</div>
  <div id="vacancyCards" class="cards"></div>

  <!-- ASSIGNED -->
  <div class="section-title">Assigned Today</div>
  <div id="assignedCards" class="cards"></div>

</div>

<!-- ================== SCRIPT ================== -->
<script src="js/places.js"></script>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";

/* LOGOUT */
function logout(){
  localStorage.clear();
  location.href="index.html";
}

/* LOAD FILTERS */
document.addEventListener("DOMContentLoaded",()=>{
  cities.forEach(c=>{
    filterCity.innerHTML+=`<option>${c}</option>`;
  });
  ["Physics","Chemistry","Biology","Maths"].forEach(s=>{
    filterSubject.innerHTML+=`<option>${s}</option>`;
  });
  ["KCET","NEET","Boards","JEE","Foundation"].forEach(l=>{
    filterLevel.innerHTML+=`<option>${l}</option>`;
  });
  loadVacancies();
});

/* LOAD VACANCIES */
async function loadVacancies(){
  vacancyCards.innerHTML="Loading...";
  const res = await fetch(`${SCRIPT_URL}?action=getVacancies`);
  const data = await res.json();
  vacancyCards.innerHTML="";

  data.filter(v=>v.status==="Open").forEach(v=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <h3>${v.college}</h3>
      <p><b>City:</b> ${v.city}</p>
      <p><b>Subject:</b> ${v.subject}</p>
      <p><b>Level:</b> ${v.level}</p>
      <p><b>Faculty Required:</b> ${v.faculty}</p>
      <p><b>Salary:</b> ₹${v.salaryFrom} – ₹${v.salaryTo}</p>

      <div style="display:flex;gap:10px;margin-top:12px">
        <button class="btn auto" onclick="autoAssign('${v.id}',${v.faculty})">Auto Assign</button>
        <button class="btn primary" onclick="manualAssign('${v.id}',${v.faculty})">Manual Assign</button>
      </div>
      <div id="assign_${v.id}"></div>
    `;
    vacancyCards.appendChild(card);
  });
}

/* AUTO ASSIGN */
async function autoAssign(vacancyId,needed){
  const box=document.getElementById("assign_"+vacancyId);
  box.innerHTML="Finding best matches...";
  const res = await fetch(`${SCRIPT_URL}?action=getLecturers`);
  const lecturers = await res.json();
  const top = lecturers.filter(l=>l.status==="Active").slice(0,needed);

  renderAssign(box,vacancyId,top);
}

/* MANUAL ASSIGN */
async function manualAssign(vacancyId,needed){
  const box=document.getElementById("assign_"+vacancyId);
  box.innerHTML="Loading lecturers...";
  const res = await fetch(`${SCRIPT_URL}?action=getLecturers`);
  const lecturers = await res.json();
  renderAssign(box,vacancyId,lecturers.filter(l=>l.status==="Active"),needed);
}

/* RENDER ASSIGNMENT */
function renderAssign(box,vacancyId,list,limit){
  box.innerHTML="";
  list.slice(0,limit||list.length).forEach(l=>{
    const d=document.createElement("div");
    d.className="lecturer";
    d.innerHTML=`
      <strong>${l.name}</strong>
      <small>${l.city} • ${l.subject} • ${l.level}</small>
      <p>Salary Expected: ₹${l.salaryFrom} – ₹${l.salaryTo}</p>
      <button class="btn success small" onclick="finalAssign('${vacancyId}','${l.id}')">Assign</button>
    `;
    box.appendChild(d);
  });
}

/* FINAL ASSIGN */
async function finalAssign(vacancyId,lecturerId){
  const agreed = prompt("Agreed Salary?");
  if(!agreed) return;

  await fetch(`${SCRIPT_URL}?action=addAssignment`,{
    method:"POST",
    body:JSON.stringify({vacancyId,lecturerId,agreedSalary:agreed})
  });

  alert("Assigned successfully");
  loadVacancies();
}
</script>

</body>
</html>
