<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Assignments | Scheduler CRM</title>

<style>
body {
  margin: 0;
  font-family: Segoe UI, Arial;
  background: #f2f4f8;
}
header {
  background: #2b4f81;
  color: white;
  padding: 14px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
header img { height: 36px; }
nav a {
  color: white;
  margin-left: 16px;
  text-decoration: none;
  font-weight: 500;
}
main { padding: 24px; }
h2 { margin-top: 30px; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 18px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.1);
}

.btn {
  padding: 8px 12px;
  border-radius: 6px;
  border: none;
  font-weight: 600;
  cursor: pointer;
}
.auto { background:#2b6cb0; color:white; }
.manual { background:#6b46c1; color:white; }
.assign { background:#2f855a; color:white; }
.ok { background:#2f855a; color:white; }
.no { background:#c53030; color:white; }

.badge {
  display:inline-block;
  background:#edf2f7;
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
  margin-right:6px;
}
</style>
</head>

<body>

<header>
  <img src="logo.png.jpg">
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lectures.html">Lecturers</a>
    <a href="#" onclick="logout()">Logout</a>
  </nav>
</header>

<main>

<h2>Open Vacancies</h2>
<div id="vacancies" class="grid"></div>

<h2>Assigned Today</h2>
<div id="assigned" class="grid"></div>

</main>

<script>
const API = "https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";

const get = url => fetch(url).then(r => r.json());

function safe(v){ return v ?? "-"; }

async function loadVacancies() {
  const rows = await get(`${API}?action=getVacancies`);
  const box = document.getElementById("vacancies");
  box.innerHTML = "";

  rows
    .filter(v => v.Status === "Open")
    .forEach(v => {
      box.innerHTML += `
      <div class="card">
        <h3>${safe(v.CollegeName)}</h3>
        <div class="badge">${v.VacancyID}</div>
        <div class="badge">${v.Subject} | ${v.Level}</div>
        <p>City: ${v.City}</p>
        <p>Salary: ₹${v.SalaryFrom} - ₹${v.SalaryTo}</p>
        <p>Faculty Required: ${v.FacultyRequired}</p>
        <p>${safe(v.Notes)}</p>
        <button class="btn auto" onclick="autoAssign('${v.VacancyID}')">Auto Assign</button>
        <button class="btn manual" onclick="manualAssign('${v.VacancyID}')">Manual Assign</button>
      </div>`;
    });
}

async function autoAssign(vacancyId) {
  const lecturers = await get(`${API}?action=getLecturers`);
  const top3 = lecturers.slice(0,3);
  showLecturers(vacancyId, top3);
}

async function manualAssign(vacancyId) {
  const lecturers = await get(`${API}?action=getLecturers`);
  showLecturers(vacancyId, lecturers);
}

function showLecturers(vacancyId, list) {
  const box = document.getElementById("vacancies");
  box.innerHTML = "";

  list.forEach(l => {
    box.innerHTML += `
    <div class="card">
      <h3>${l.Name}</h3>
      <div class="badge">${l.LecturerID}</div>
      <p>${l.City}</p>
      <p>₹${l.SalaryFrom} - ₹${l.SalaryTo}</p>
      <button class="btn assign" onclick="assign('${vacancyId}','${l.LecturerID}')">Assign</button>
    </div>`;
  });
}

async function assign(vacancyId, lecturerId) {
  await get(`${API}?action=assign&vacancyId=${vacancyId}&lecturerId=${lecturerId}`);
  loadAssignments();
  loadVacancies();
}

async function loadAssignments() {
  const rows = await get(`${API}?action=getAssignmentsToday`);
  const box = document.getElementById("assigned");
  box.innerHTML = "";

  rows.forEach(a => {
    box.innerHTML += `
    <div class="card">
      <h3>${a.CollegeName}</h3>
      <p>${a.LecturerName}</p>
      <button class="btn ok" onclick="update('${a.AssignmentID}','Selected')">Selected</button>
      <button class="btn no" onclick="update('${a.AssignmentID}','Not Selected')">Not Selected</button>
    </div>`;
  });
}

async function update(id,status){
  await get(`${API}?action=updateAssignmentStatus&id=${id}&status=${status}`);
  loadAssignments();
  loadVacancies();
}

function logout(){
  localStorage.clear();
  location.href="index.html";
}

loadVacancies();
loadAssignments();
</script>

</body>
</html>
