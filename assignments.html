<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Assignments | Scheduler CRM</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: #f4f6fb;
  color: #222;
}

header {
  background: linear-gradient(90deg, #1f2937, #374151);
  color: #fff;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

header img {
  height: 36px;
  border-radius: 8px;
}

nav a {
  color: #e5e7eb;
  margin-left: 20px;
  text-decoration: none;
  font-weight: 500;
}

nav a:hover {
  color: #fff;
}

.container {
  padding: 24px;
}

h2 {
  margin-top: 32px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}

.card {
  background: #ffffff;
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

.card h3 {
  margin: 0 0 6px 0;
}

.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  background: #eef2ff;
  color: #3730a3;
  margin-bottom: 10px;
}

.row {
  font-size: 14px;
  margin-bottom: 6px;
}

.actions {
  margin-top: 12px;
}

button {
  border: none;
  border-radius: 8px;
  padding: 8px 12px;
  cursor: pointer;
  font-weight: 600;
}

.auto {
  background: #2563eb;
  color: #fff;
}

.manual {
  background: #7c3aed;
  color: #fff;
}

.assign {
  background: #16a34a;
  color: #fff;
  margin-top: 8px;
}

.selected {
  background: #16a34a;
  color: #fff;
}

.not-selected {
  background: #dc2626;
  color: #fff;
}
</style>
</head>

<body>

<header>
  <img src="logo.png.jpg" alt="Logo">
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a href="assignments.html"><b>Assignments</b></a>
  </nav>
</header>

<div class="container">

<h2>Open Vacancies</h2>
<div id="vacancies" class="grid"></div>

<h2>Assigned Today</h2>
<div id="assignedToday" class="grid"></div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";

/* ---------- LOAD DATA ---------- */
document.addEventListener("DOMContentLoaded", () => {
  loadVacancies();
  loadAssignedToday();
});

async function loadVacancies() {
  const res = await fetch(API + "?action=getOpenVacancies");
  const data = await res.json();

  const box = document.getElementById("vacancies");
  box.innerHTML = "";

  data.forEach(v => {
    box.innerHTML += `
      <div class="card">
        <span class="badge">${v.VacancyID}</span>
        <h3>${v.CollegeName}</h3>

        <div class="row">📍 ${v.City}</div>
        <div class="row">📚 ${v.Subject} | ${v.Level}</div>
        <div class="row">👥 Faculty Required: ${v.FacultyRequired}</div>
        <div class="row">💰 ₹${v.SalaryFrom} – ₹${v.SalaryTo}</div>
        <div class="row">📝 ${v.Notes || "-"}</div>

        <div class="actions">
          <button class="auto" onclick="autoAssign('${v.VacancyID}')">Auto Assign</button>
          <button class="manual" onclick="manualAssign('${v.VacancyID}')">Manual Assign</button>
        </div>
      </div>
    `;
  });
}

/* ---------- ASSIGNED TODAY ---------- */
async function loadAssignedToday() {
  const res = await fetch(API + "?action=getAssignmentsToday");
  const data = await res.json();

  const box = document.getElementById("assignedToday");
  box.innerHTML = "";

  data.forEach(a => {
    box.innerHTML += `
      <div class="card">
        <span class="badge">${a.AssignmentID}</span>
        <h3>${a.CollegeName}</h3>

        <div class="row">👨‍🏫 ${a.LecturerName}</div>
        <div class="row">📚 ${a.Subject} | ${a.Level}</div>
        <div class="row">💰 ₹${a.AgreedSalary}</div>
        <div class="row">📌 ${a.AssignmentType}</div>

        <div class="actions">
          <button class="selected" onclick="markSelected('${a.AssignmentID}')">Selected</button>
          <button class="not-selected" onclick="markNotSelected('${a.AssignmentID}')">Not Selected</button>
        </div>
      </div>
    `;
  });
}

/* ---------- ACTIONS ---------- */
function autoAssign(vacancyId) {
  alert("Auto assign logic triggered for " + vacancyId);
}

function manualAssign(vacancyId) {
  alert("Manual assign logic triggered for " + vacancyId);
}

function markSelected(id) {
  fetch(API + "?action=markSelected&assignmentId=" + id)
    .then(() => loadAssignedToday());
}

function markNotSelected(id) {
  fetch(API + "?action=markNotSelected&assignmentId=" + id)
    .then(() => loadAssignedToday());
}
</script>

</body>
</html>
