<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lecturers | Scheduler for RC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --grad:linear-gradient(135deg,#2563eb,#0f766e);
  --bg:#f1f5f9;
  --card:#ffffffee;
}
*{box-sizing:border-box;font-family:Inter,system-ui}
body{margin:0;background:var(--bg)}

header{
  background:var(--grad);
  color:#fff;
  padding:14px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header .left{
  display:flex;
  align-items:center;
  gap:12px;
}
.logo{
  height:36px;width:36px;
  border-radius:10px;
  background:#fff;
  padding:4px;
}
nav a{
  color:#fff;
  margin-left:18px;
  text-decoration:none;
  font-weight:500;
}

.container{padding:30px}
.card{
  background:var(--card);
  border-radius:16px;
  padding:22px;
  box-shadow:0 18px 40px rgba(0,0,0,.12);
}

.filters{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:12px;
  margin-bottom:18px;
}
.filters select,.filters input{
  padding:8px 10px;
  border-radius:10px;
  border:1px solid #cbd5e1;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th,td{
  padding:10px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
  font-size:13px;
}
th{background:#f8fafc}

.badge{
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:600;
}
.active{background:#dcfce7;color:#166534}
.inactive{background:#fee2e2;color:#991b1b}

.actions button{
  border:none;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
}
.delete{background:#fee2e2;color:#991b1b}

.top-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}
.print-btn{
  padding:8px 14px;
  border-radius:10px;
  background:var(--grad);
  color:#fff;
  border:none;
  cursor:pointer;
}

@media print{
  header,.filters,.top-actions,.actions{display:none}
  body{background:#fff}
  table{margin-top:0}
}
</style>
</head>

<body>

<header>
  <div class="left">
    <img src="logo.png.jpg" class="logo">
    <strong>Scheduler for RC</strong>
  </div>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a href="assignments.html">Assignments</a>
    <a href="index.html" onclick="logout()">Logout</a>
  </nav>
</header>

<div class="container">
<div class="card">

<div class="top-actions">
  <h3>Lecturers</h3>
  <button class="print-btn" onclick="window.print()">Print</button>
</div>

<div class="filters">
  <input id="fName" placeholder="Name">
  <select id="fCity"></select>
  <select id="fSubject">
    <option value="">Subject</option>
    <option>Physics</option>
    <option>Chemistry</option>
    <option>Maths</option>
    <option>Biology</option>
  </select>
  <select id="fLevel">
    <option value="">Level</option>
    <option>KCET</option>
    <option>NEET</option>
    <option>Boards</option>
    <option>JEE</option>
    <option>Foundation</option>
  </select>
  <select id="fStatus">
    <option value="">Status</option>
    <option>Active</option>
    <option>Inactive</option>
  </select>
  <button onclick="applyFilters()">Filter</button>
</div>

<table>
<thead>
<tr>
  <th>ID</th>
  <th>Name</th>
  <th>City</th>
  <th>Subject</th>
  <th>Level</th>
  <th>Salary</th>
  <th>Status</th>
  <th>Action</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</div>
</div>

<script src="js/places.js"></script>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";
let lecturers=[];

document.addEventListener("DOMContentLoaded",()=>{
  const c=document.getElementById("fCity");
  c.innerHTML='<option value="">City</option>';
  cities.forEach(x=>c.add(new Option(x,x)));
  loadLecturers();
});

function loadLecturers(){
  fetch(`${SCRIPT_URL}?action=getLecturers`)
    .then(r=>r.json())
    .then(d=>{
      lecturers=d;
      render(d);
    });
}

function render(data){
  const tb=document.getElementById("tbody");
  tb.innerHTML="";
  data.forEach(l=>{
    tb.innerHTML+=`
    <tr>
      <td>${l.id}</td>
      <td>${l.name}</td>
      <td>${l.city}</td>
      <td>${l.subject}</td>
      <td>${l.level}</td>
      <td>₹${l.salaryFrom}–₹${l.salaryTo}</td>
      <td><span class="badge ${l.status==='Active'?'active':'inactive'}">${l.status}</span></td>
      <td class="actions">
        <button class="delete" onclick="del('${l.id}')">Delete</button>
      </td>
    </tr>`;
  });
}

function applyFilters(){
  let d=[...lecturers];
  const n=fName.value.toLowerCase();
  if(n)d=d.filter(x=>x.name.toLowerCase().includes(n));
  if(fCity.value)d=d.filter(x=>x.city===fCity.value);
  if(fSubject.value)d=d.filter(x=>x.subject===fSubject.value);
  if(fLevel.value)d=d.filter(x=>x.level===fLevel.value);
  if(fStatus.value)d=d.filter(x=>x.status===fStatus.value);
  render(d);
}

function del(id){
  if(!confirm("Delete lecturer?"))return;
  fetch(`${SCRIPT_URL}?action=deleteLecturer&id=${id}`)
    .then(()=>loadLecturers());
}

function logout(){
  localStorage.removeItem("scheduler_session");
}
</script>

</body>
</html>
