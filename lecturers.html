<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lecturers | Scheduler for RC</title>

  <link rel="stylesheet" href="css/common.css" />

  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f4f6fb;
      margin: 0;
    }

    /* ===== HEADER ===== */
    header {
      background: #ffffff;
      border-bottom: 1px solid #ddd;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 18px;
    }

    .brand img {
      height: 34px;
    }

    nav a {
      margin: 0 12px;
      text-decoration: none;
      color: #333;
      font-weight: 500;
    }

    nav a.active {
      color: #2563eb;
      border-bottom: 2px solid #2563eb;
      padding-bottom: 4px;
    }

    .logout-btn {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    /* ===== MAIN ===== */
    main {
      padding: 24px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .page-header h2 {
      margin: 0;
    }

    .actions button {
      margin-left: 10px;
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-print {
      background: #16a34a;
      color: #fff;
    }

    .btn-add {
      background: #2563eb;
      color: #fff;
    }

    /* ===== FILTERS ===== */
    .filters {
      background: #ffffff;
      padding: 14px;
      border-radius: 8px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .filters input,
    .filters select {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      width: 100%;
    }

    /* ===== TABLE ===== */
    .table-wrapper {
      background: #ffffff;
      border-radius: 8px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background: #f1f5f9;
      font-weight: 700;
    }

    .status {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .status.active {
      background: #dcfce7;
      color: #166534;
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    /* ===== PRINT ===== */
    @media print {
      body {
        background: #fff;
      }
      header, .filters, .actions {
        display: none;
      }
      main {
        padding: 20mm;
      }
      .brand {
        margin-bottom: 10px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <img src="logo.png.jpg" alt="Rutvi Consultants" />
    Scheduler for RC
  </div>

  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lecturers.html" class="active">Lecturers</a>
    <a href="assignments.html">Assignments</a>
  </nav>

  <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<main>
  <div class="page-header">
    <h2>Lecturers</h2>
    <div class="actions">
      <button class="btn-print" onclick="window.print()">Print</button>
      <button class="btn-add" onclick="location.href='add-lecturer.html'">+ Add Lecturer</button>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="filters">
    <input type="text" id="searchName" placeholder="Search Name" onkeyup="applyFilters()" />
    <input type="text" id="searchCity" list="citiesList" placeholder="City" onkeyup="applyFilters()" />

    <select id="filterSubject" onchange="applyFilters()">
      <option value="">All Subjects</option>
      <option>Physics</option>
      <option>Chemistry</option>
      <option>Mathematics</option>
      <option>Biology</option>
      <option>Zoology</option>
      <option>Botany</option>
      <option>Others</option>
    </select>

    <select id="filterLevel" onchange="applyFilters()">
      <option value="">All Levels</option>
      <option>Boards</option>
      <option>KCET</option>
      <option>NEET</option>
      <option>JEE Mains</option>
      <option>JEE Advanced</option>
      <option>Foundation</option>
    </select>

    <select id="salaryMin" onchange="applyFilters()">
      <option value="">Min ₹</option>
      <option value="50000">₹50k</option>
      <option value="100000">₹1L</option>
      <option value="150000">₹1.5L</option>
      <option value="200000">₹2L</option>
      <option value="250000">₹2.5L</option>
      <option value="300000">₹3L</option>
      <option value="350000">₹3.5L</option>
    </select>

    <select id="salaryMax" onchange="applyFilters()">
      <option value="">Max ₹</option>
      <option value="50000">₹50k</option>
      <option value="100000">₹1L</option>
      <option value="150000">₹1.5L</option>
      <option value="200000">₹2L</option>
      <option value="250000">₹2.5L</option>
      <option value="300000">₹3L</option>
      <option value="350000">₹3.5L</option>
    </select>
  </div>

  <!-- TABLE -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Phone</th>
          <th>City</th>
          <th>Subject</th>
          <th>Level</th>
          <th>Salary</th>
          <th>Experience</th>
          <th>Availability</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="lecturersTable"></tbody>
    </table>
  </div>
</main>

<datalist id="citiesList"></datalist>

<script src="js/places.js"></script>

<script>
const SCRIPT_URL = "YOUR_APPS_SCRIPT_URL_HERE";

let lecturersData = [];

async function loadLecturers() {
  const res = await fetch(`${SCRIPT_URL}?action=getLecturers`);
  lecturersData = await res.json();
  renderTable(lecturersData);
}

function renderTable(data) {
  const tbody = document.getElementById("lecturersTable");
  tbody.innerHTML = "";

  data.forEach(l => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${l.lecturerId}</td>
      <td>${l.name}</td>
      <td>${l.phone}</td>
      <td>${l.city}</td>
      <td>${l.subject}</td>
      <td>${l.level}</td>
      <td>₹${l.salaryFrom} - ₹${l.salaryTo}</td>
      <td>${l.experience} yrs</td>
      <td>${l.availability}</td>
      <td><span class="status active">${l.status}</span></td>
      <td>
        <button class="delete-btn" onclick="deleteLecturer('${l.lecturerId}')">🗑️</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function applyFilters() {
  const name = searchName.value.toLowerCase();
  const city = searchCity.value.toLowerCase();
  const subject = filterSubject.value;
  const level = filterLevel.value;
  const min = Number(salaryMin.value || 0);
  const max = Number(salaryMax.value || 9999999);

  const filtered = lecturersData.filter(l =>
    l.name.toLowerCase().includes(name) &&
    l.city.toLowerCase().includes(city) &&
    (!subject || l.subject === subject) &&
    (!level || l.level === level) &&
    l.salaryFrom >= min &&
    l.salaryTo <= max
  );

  renderTable(filtered);
}

async function deleteLecturer(id) {
  if (!confirm("Delete lecturer " + id + "?")) return;
  await fetch(`${SCRIPT_URL}?action=deleteLecturer&id=${id}`, { method: "POST" });
  loadLecturers();
}

function logout() {
  localStorage.clear();
  location.href = "index.html";
}

document.addEventListener("DOMContentLoaded", loadLecturers);
</script>

</body>
</html>
