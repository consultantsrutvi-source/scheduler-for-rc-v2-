<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vacancies | Scheduler for RC</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: #f4f6f9;
  color: #333;
}

header {
  background: #ffffff;
  border-bottom: 1px solid #ddd;
  padding: 10px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand img {
  height: 36px;
}

nav a {
  margin: 0 10px;
  text-decoration: none;
  color: #555;
  font-weight: 500;
}

nav a.active {
  color: #1976d2;
  border-bottom: 2px solid #1976d2;
  padding-bottom: 4px;
}

.logout-btn {
  background: #e53935;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
}

main {
  padding: 24px;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

.page-header h2 {
  margin: 0;
}

.actions button {
  margin-left: 8px;
  padding: 8px 14px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: 500;
}

.btn-print {
  background: #4caf50;
  color: white;
}

.btn-add {
  background: #1976d2;
  color: white;
}

.filters {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
  background: #ffffff;
  padding: 14px;
  border-radius: 6px;
  margin-bottom: 16px;
}

.filters input,
.filters select {
  padding: 7px;
  border: 1px solid #ccc;
  border-radius: 4px;
}

.table-wrapper {
  background: white;
  border-radius: 6px;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #eee;
  text-align: left;
  font-size: 14px;
}

th {
  background: #f0f2f5;
}

.status-badge {
  padding: 4px 8px;
  border-radius: 12px;
  font-size: 12px;
  color: white;
  background: #43a047;
}

.actions-col button {
  border: none;
  background: none;
  cursor: pointer;
  font-size: 16px;
}

@media print {
  body {
    background: white;
  }

  header, .actions, .filters, .actions-col {
    display: none;
  }

  main {
    padding: 20px;
  }

  table {
    margin-top: 10px;
  }

  @page {
    margin: 20mm;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <img src="logo.png.jpg" alt="Rutvi Consultants">
    <strong>Scheduler for RC</strong>
  </div>

  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html" class="active">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a href="assignments.html">Assignments</a>
  </nav>

  <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<main>

<div class="page-header">
  <h2>Vacancies</h2>
  <div class="actions">
    <button class="btn-print" onclick="window.print()">Print</button>
    <button class="btn-add" onclick="location.href='add-vacancy.html'">Add Vacancy</button>
  </div>
</div>

<div class="filters">
  <input type="text" id="filterCollege" placeholder="Search College" oninput="applyFilters()">
<input
  type="text"
  id="filterCity"
  list="citiesList"
  placeholder="Search / Select City"
  oninput="applyFilters()"
/>

<datalist id="citiesList"></datalist>


  <select id="filterSubject" onchange="applyFilters()">
    <option value="">All Subjects</option>
    <option>Physics</option>
    <option>Chemistry</option>
    <option>Mathematics</option>
    <option>Biology</option>
    <option>Zoology</option>
    <option>Botany</option>
  </select>

  <select id="filterLevel" onchange="applyFilters()">
    <option value="">All Levels</option>
    <option>Boards</option>
    <option>KCET</option>
    <option>NEET</option>
    <option>JEE Mains</option>
    <option>JEE Advanced</option>
    <option>Foundation</option>
  </select>

  <select id="filterUrgency" onchange="applyFilters()">
    <option value="">All Urgency</option>
    <option>Immediate</option>
    <option>Within 1 Week</option>
    <option>Within 15 Days</option>
    <option>Within 1 Month</option>
  </select>

  <select id="filterStatus" onchange="applyFilters()">
    <option value="">All Status</option>
    <option>Open</option>
    <option>Assigned</option>
    <option>Closed</option>
  </select>

 <select id="salaryFromFilter" onchange="applyFilters()">
  <option value="">Min Salary</option>
  <option value="50000">₹50k</option>
  <option value="75000">₹75k</option>
  <option value="100000">₹100k</option>
  <option value="125000">₹125k</option>
  <option value="150000">₹150k</option>
  <option value="175000">₹175k</option>
  <option value="200000">₹200k</option>
  <option value="225000">₹225k</option>
  <option value="250000">₹250k</option>
  <option value="275000">₹275k</option>
  <option value="300000">₹300k</option>
  <option value="325000">₹325k</option>
  <option value="350000">₹350k</option>
</select>

<select id="salaryToFilter" onchange="applyFilters()">
  <option value="">Max Salary</option>
  <option value="50000">₹50k</option>
  <option value="75000">₹75k</option>
  <option value="100000">₹100k</option>
  <option value="125000">₹125k</option>
  <option value="150000">₹150k</option>
  <option value="175000">₹175k</option>
  <option value="200000">₹200k</option>
  <option value="225000">₹225k</option>
  <option value="250000">₹250k</option>
  <option value="275000">₹275k</option>
  <option value="300000">₹300k</option>
  <option value="325000">₹325k</option>
  <option value="350000">₹350k</option>
</select>

</div>

<div class="table-wrapper">
<table>
<thead>
<tr>
  <th>ID</th>
  <th>College</th>
  <th>City</th>
  <th>Subject</th>
  <th>Level</th>
  <th>Salary</th>
  <th>Urgency</th>
  <th>Faculty</th>
  <th>Status</th>
  <th>Actions</th>
</tr>
</thead>

<tbody id="vacancyTable"></tbody>
</table>
</div>

</main>
<script src="js/places.js"></script>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsT3dyPERKTfYhTf4BjCo8mzLrzYGxhLmS0MLfXnjX3hElLESnqchauzgxV87uJ4BOMA/exec";
let allVacancies = [];

async function loadVacancies() {
  const res = await fetch(SCRIPT_URL);
  allVacancies = await res.json();
  renderRows(allVacancies);
}

function renderRows(data) {
  const tbody = document.getElementById("vacancyTable");
  tbody.innerHTML = "";

  data.forEach(v => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${v.id}</td>
      <td>${v.college}</td>
      <td>${v.city}</td>
      <td>${v.subject}</td>
      <td>${v.level}</td>
      <td>₹${v.salaryFrom} - ₹${v.salaryTo}</td>
      <td>${v.urgency}</td>
      <td>${v.faculty}</td>
      <td><span class="status-badge">${v.status}</span></td>
      <td class="actions-col">
        <button onclick="deleteVacancy('${v.id}')">🗑️</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function applyFilters() {
  const college = filterCollege.value.toLowerCase();
  const city = filterCity.value.toLowerCase();
  const subject = filterSubject.value;
  const level = filterLevel.value;
  const urgency = filterUrgency.value;
  const status = filterStatus.value;
  const min = Number(salaryFromFilter.value || 0);
  const max = Number(salaryToFilter.value || 9999999);

  const filtered = allVacancies.filter(v =>
    (!college || v.college.toLowerCase().includes(college)) &&
    (!city || v.city.toLowerCase().includes(city)) &&
    (!subject || v.subject === subject) &&
    (!level || v.level === level) &&
    (!urgency || v.urgency === urgency) &&
    (!status || v.status === status) &&
    (v.salaryFrom >= min && v.salaryTo <= max)
  );

  renderRows(filtered);
}

async function deleteVacancy(id) {
  if (!confirm("Delete vacancy " + id + "?")) return;
  await fetch(`${SCRIPT_URL}?id=${id}`, { method: "DELETE" });
  loadVacancies();
}

function logout() {
  localStorage.clear();
  location.href = "index.html";
}

document.addEventListener("DOMContentLoaded", loadVacancies);
</script>
<script>
function logout() {
  localStorage.clear();
  sessionStorage.clear();
  location.href = "index.html";
}
</script>

</body>
</html>
