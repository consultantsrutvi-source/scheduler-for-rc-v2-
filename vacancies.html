<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vacancies | Scheduler for RC</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/vacancies.css">
</head>

<body>

<!-- ===== HEADER ===== -->
<header class="top-bar">
  <div class="logo">Scheduler for RC</div>

  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html" class="active">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a href="assignments.html">Assignments</a>
  </nav>

  <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<!-- ===== MAIN ===== -->
<main class="vacancy-container">

  <!-- PAGE HEADER -->
  <div class="page-header">
    <div>
      <h2>Vacancies</h2>
      <p class="subtitle">Search, filter and manage faculty requirements</p>
    </div>

    <div class="header-actions">
      <button class="btn btn-print" onclick="window.print()">🖨 Print</button>
      <button class="btn btn-primary" onclick="location.href='add-vacancy.html'">＋ Add Vacancy</button>
    </div>
  </div>

  <!-- FILTER BAR -->
  <div class="filter-bar">
    <input type="text" id="searchCollege" placeholder="Search College">

    <input list="placesList" id="placeInput" placeholder="Search / Select City">
    <datalist id="placesList"></datalist>

    <select id="filterSubject">
      <option value="">All Subjects</option>
      <option>Physics</option>
      <option>Chemistry</option>
      <option>Mathematics</option>
      <option>Biology</option>
      <option>Zoology</option>
      <option>Botany</option>
      <option>Others</option>
    </select>

    <select id="filterLevel">
      <option value="">All Levels</option>
      <option>Boards</option>
      <option>KCET</option>
      <option>NEET</option>
      <option>JEE Mains</option>
      <option>JEE Advanced</option>
      <option>Foundation</option>
    </select>

    <select id="filterUrgency">
      <option value="">All Urgency</option>
      <option>Immediate</option>
      <option>Within 1 Week</option>
      <option>Within 1 Month</option>
    </select>

    <select id="filterStatus">
      <option value="">All Status</option>
      <option>Open</option>
      <option>Assigned</option>
      <option>Closed</option>
    </select>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>College</th>
          <th>City</th>
          <th>Subject</th>
          <th>Level</th>
          <th>Salary</th>
          <th>Urgency</th>
          <th>Faculty</th>
          <th>Status</th>
          <th class="no-print">Actions</th>
        </tr>
      </thead>

      <tbody id="vacancyTable">
        <tr>
          <td colspan="10" class="empty">No vacancies yet. Click <b>Add Vacancy</b>.</td>
        </tr>
      </tbody>
    </table>
  </div>

</main>

<script src="js/vacancies.js"></script>
</body>
</html>
