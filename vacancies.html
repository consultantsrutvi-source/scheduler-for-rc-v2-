<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Vacancies | Scheduler CRM</title>

<style>
:root{
  --primary:#2563eb;
  --danger:#ef4444;
  --bg:#f4f6fb;
  --card:#ffffff;
  --text:#1f2937;
}
*{box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{margin:0;background:var(--bg);color:var(--text)}

header{
  background:linear-gradient(135deg,#2563eb,#1e40af);
  color:#fff;padding:16px 24px;
  display:flex;align-items:center;justify-content:space-between
}
header img{height:36px}
header nav a{
  color:#fff;text-decoration:none;margin-right:16px;font-weight:500
}
header button{
  background:var(--danger);border:none;color:#fff;
  padding:8px 14px;border-radius:6px;cursor:pointer
}

main{padding:24px}

.card{
  background:var(--card);
  border-radius:10px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 10px 20px rgba(0,0,0,.06)
}

.filters{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px
}
.filters input,.filters select{
  padding:8px;border:1px solid #d1d5db;border-radius:6px
}

.actions{
  display:flex;
  justify-content:space-between;
  align-items:center
}
.actions button{
  background:var(--primary);
  border:none;
  color:#fff;
  padding:8px 14px;
  border-radius:6px;
  cursor:pointer
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:16px
}
th,td{
  padding:10px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
  font-size:14px
}
th{background:#f1f5f9}

.badge{
  padding:4px 8px;
  border-radius:12px;
  font-size:12px;
  color:#fff;
  background:#10b981
}

button.del{
  background:var(--danger);
  border:none;
  color:#fff;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer
}

/* PRINT */
@media print{
  body{background:#fff}
  header,.filters,.actions,button.del{display:none}
  table{font-size:12px}
}
</style>
</head>

<body>

<header>
  <div style="display:flex;align-items:center;gap:16px">
    <img src="logo.png.jpg" alt="Logo">
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="add-vacancy.html">Add Vacancy</a>
      <a href="lecturers.html">Lecturers</a>
    </nav>
  </div>
  <button onclick="logout()">Logout</button>
</header>

<main>

<div class="card actions">
  <h2>Vacancies</h2>
  <button onclick="window.print()">Print</button>
</div>

<div class="card">
  <div class="filters">
    <input id="fCollege" placeholder="College">
    <input id="fCity" placeholder="City">
    <input id="fSubject" placeholder="Subject">
    <input id="fLevel" placeholder="Level">

    <select id="fSalaryFrom">
      <option value="">Salary From</option>
      <option value="50000">₹50k</option>
      <option value="100000">₹1L</option>
      <option value="150000">₹1.5L</option>
      <option value="200000">₹2L</option>
      <option value="250000">₹2.5L</option>
      <option value="300000">₹3L</option>
      <option value="350000">₹3.5L</option>
    </select>

    <select id="fSalaryTo">
      <option value="">Salary To</option>
      <option value="50000">₹50k</option>
      <option value="100000">₹1L</option>
      <option value="150000">₹1.5L</option>
      <option value="200000">₹2L</option>
      <option value="250000">₹2.5L</option>
      <option value="300000">₹3L</option>
      <option value="350000">₹3.5L</option>
    </select>

    <input id="fUrgency" placeholder="Urgency">
    <input id="fStatus" placeholder="Status">
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>College</th>
        <th>City</th>
        <th>Subject</th>
        <th>Level</th>
        <th>Salary</th>
        <th>Urgency</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="vacBody"></tbody>
  </table>
</div>

</main>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";
let vacancies=[];

function logout(){
  localStorage.clear();
  location.href="index.html";
}

async function loadVacancies(){
  const res = await fetch(SCRIPT_URL+"?action=getVacancies");
  vacancies = await res.json();
  render();
}

function render(){
  const body=document.getElementById("vacBody");
  body.innerHTML="";

  const fc=fCollege.value.toLowerCase();
  const city=fCity.value.toLowerCase();
  const sub=fSubject.value.toLowerCase();
  const lvl=fLevel.value.toLowerCase();
  const salFrom=Number(fSalaryFrom.value||0);
  const salTo=Number(fSalaryTo.value||99999999);
  const urg=fUrgency.value.toLowerCase();
  const st=fStatus.value.toLowerCase();

  vacancies.filter(v=>{
    return (!fc||v.college.toLowerCase().includes(fc)) &&
           (!city||v.city.toLowerCase().includes(city)) &&
           (!sub||v.subject.toLowerCase().includes(sub)) &&
           (!lvl||v.level.toLowerCase().includes(lvl)) &&
           (v.salaryFrom>=salFrom) &&
           (v.salaryTo<=salTo) &&
           (!urg||v.urgency.toLowerCase().includes(urg)) &&
           (!st||v.status.toLowerCase().includes(st));
  }).forEach(v=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${v.id}</td>
      <td>${v.college}</td>
      <td>${v.city}</td>
      <td>${v.subject}</td>
      <td>${v.level}</td>
      <td>₹${v.salaryFrom} – ₹${v.salaryTo}</td>
      <td>${v.urgency}</td>
      <td><span class="badge">${v.status}</span></td>
      <td><button class="del" onclick="delVac('${v.id}')">Delete</button></td>`;
    body.appendChild(tr);
  });
}

async function delVac(id){
  if(!confirm("Delete vacancy?"))return;
  await fetch(SCRIPT_URL+"?action=deleteVacancy",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id})
  });
  loadVacancies();
}

["fCollege","fCity","fSubject","fLevel","fSalaryFrom","fSalaryTo","fUrgency","fStatus"]
.forEach(id=>document.getElementById(id).addEventListener("input",render));

loadVacancies();
</script>

</body>
</html>
