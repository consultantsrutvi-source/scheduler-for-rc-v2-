<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vacancies | Scheduler for RC</title>

  <link rel="stylesheet" href="css/vacancies.css" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #f5f7fb;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header nav a {
      margin: 0 10px;
      text-decoration: none;
      color: #374151;
      font-weight: 500;
    }

    header nav a.active {
      color: #2563eb;
      font-weight: 600;
    }

    .logout-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    main {
      padding: 24px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .actions button {
      margin-left: 8px;
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-print {
      background: #10b981;
      color: white;
    }

    .btn-add {
      background: #2563eb;
      color: white;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .filters input,
    .filters select {
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #f9fafb;
      font-weight: 600;
    }

    .status {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
    }

    .status.open {
      background: #dcfce7;
      color: #166534;
    }

    .actions-icons button {
      background: none;
      border: none;
      cursor: pointer;
      margin-right: 6px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<header>
  <strong>Scheduler for RC</strong>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html" class="active">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a href="assignments.html">Assignments</a>
  </nav>
  <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<main>

  <div class="page-header">
    <h2>Vacancies</h2>
    <div class="actions">
      <button class="btn-print" onclick="window.print()">Print</button>
      <button class="btn-add" onclick="location.href='add-vacancy.html'">+ Add Vacancy</button>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="filters">
    <input type="text" id="filterCollege" placeholder="Search College">
    <input type="text" id="filterCity" list="citiesList" placeholder="Search / Select City">

    <select id="filterSubject">
      <option value="">All Subjects</option>
      <option>Physics</option>
      <option>Chemistry</option>
      <option>Mathematics</option>
      <option>Biology</option>
      <option>Zoology</option>
      <option>Botany</option>
      <option>Others</option>
    </select>

    <select id="filterLevel">
      <option value="">All Levels</option>
      <option>Boards</option>
      <option>KCET</option>
      <option>NEET</option>
      <option>JEE Mains</option>
      <option>JEE Advanced</option>
      <option>Foundation</option>
    </select>

    <select id="filterUrgency">
      <option value="">All Urgency</option>
      <option>Immediate</option>
      <option>Within a week</option>
      <option>Normal</option>
    </select>

    <select id="filterStatus">
      <option value="">All Status</option>
      <option>Open</option>
      <option>Assigned</option>
      <option>Closed</option>
    </select>

    <select id="salaryFrom">
      <option value="">Min Salary</option>
      <option value="50000">₹50k</option>
      <option value="75000">₹75k</option>
      <option value="100000">₹100k</option>
      <option value="150000">₹150k</option>
      <option value="200000">₹200k</option>
    </select>

    <select id="salaryTo">
      <option value="">Max Salary</option>
      <option value="100000">₹100k</option>
      <option value="150000">₹150k</option>
      <option value="200000">₹200k</option>
      <option value="250000">₹250k</option>
      <option value="350000">₹350k</option>
    </select>
  </div>

  <!-- TABLE -->
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>College</th>
        <th>City</th>
        <th>Subject</th>
        <th>Level</th>
        <th>Salary</th>
        <th>Urgency</th>
        <th>Faculty</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="vacancyTable"></tbody>
  </table>

</main>

<datalist id="citiesList"></datalist>

<script src="js/places.js"></script>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsT3dyPERKTfYhTf4BjCo8mzLrzYGxhLmS0MLfXnjX3hElLESnqchauzgxV87uJ4BOMA/exec";

let allVacancies = [];

function logout() {
  localStorage.clear();
  location.href = "index.html";
}

async function loadVacancies() {
  const res = await fetch(SCRIPT_URL);
  allVacancies = await res.json();
  renderTable(allVacancies);
}

function renderTable(data) {
  const tbody = document.getElementById("vacancyTable");
  tbody.innerHTML = "";

  data.forEach(v => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${v.id}</td>
      <td>${v.college}</td>
      <td>${v.city}</td>
      <td>${v.subject}</td>
      <td>${v.level}</td>
      <td>₹${v.salaryFrom} - ₹${v.salaryTo}</td>
      <td>${v.urgency}</td>
      <td>${v.faculty}</td>
      <td><span class="status open">${v.status || "Open"}</span></td>
      <td class="actions-icons">
        ✏️ 🗑️
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function applyFilters() {
  const subject = filterSubject.value;
  const level = filterLevel.value;
  const urgency = filterUrgency.value;
  const status = filterStatus.value;
  const city = filterCity.value.toLowerCase();
  const college = filterCollege.value.toLowerCase();
  const min = Number(salaryFrom.value || 0);
  const max = Number(salaryTo.value || 9999999);

  const filtered = allVacancies.filter(v =>
    (!subject || v.subject === subject) &&
    (!level || v.level === level) &&
    (!urgency || v.urgency === urgency) &&
    (!status || v.status === status) &&
    (!city || v.city.toLowerCase().includes(city)) &&
    (!college || v.college.toLowerCase().includes(college)) &&
    v.salaryFrom >= min &&
    v.salaryTo <= max
  );

  renderTable(filtered);
}

document.querySelectorAll(".filters input, .filters select")
  .forEach(el => el.addEventListener("change", applyFilters));

document.addEventListener("DOMContentLoaded", loadVacancies);
</script>

</body>
</html>
