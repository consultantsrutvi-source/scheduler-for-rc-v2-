<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vacancies | Scheduler for RC</title>
  <link rel="stylesheet" href="css/vacancies.css" />
</head>

<body>

<header class="topbar">
  <div class="brand">
    <img src="logo.png.jpg" alt="Rutvi Consultants" />
    <span>Scheduler for RC</span>
  </div>

  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a class="active" href="vacancies.html">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a href="assignments.html">Assignments</a>
  </nav>

  <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<main class="container">

  <div class="page-header">
    <h2>Vacancies</h2>

    <div class="actions">
      <button class="btn print" onclick="window.print()">🖨 Print</button>
      <button class="btn add" onclick="location.href='add-vacancy.html'">➕ Add Vacancy</button>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="filters">
    <input type="text" id="filterCollege" placeholder="Search College" />
    <input type="text" id="filterPlace" list="placesList" placeholder="Search / Select City" />

    <select id="filterSubject">
      <option value="">All Subjects</option>
      <option>Physics</option>
      <option>Chemistry</option>
      <option>Mathematics</option>
      <option>Biology</option>
      <option>Zoology</option>
      <option>Botany</option>
      <option>Others</option>
    </select>

    <select id="filterLevel">
      <option value="">All Levels</option>
      <option>Boards</option>
      <option>KCET</option>
      <option>NEET</option>
      <option>JEE Mains</option>
      <option>JEE Advanced</option>
      <option>Foundation</option>
    </select>

    <select id="filterUrgency">
      <option value="">All Urgency</option>
      <option>Immediate</option>
      <option>Within a week</option>
      <option>Normal</option>
    </select>

    <select id="filterStatus">
      <option value="">All Status</option>
      <option>Open</option>
      <option>Assigned</option>
      <option>Closed</option>
    </select>
  </div>

  <!-- TABLE -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>College</th>
          <th>City</th>
          <th>Subject</th>
          <th>Level</th>
          <th>Salary</th>
          <th>Urgency</th>
          <th>Faculty</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="vacancyTable">
        <!-- JS injects rows -->
      </tbody>
    </table>
  </div>

</main>

<datalist id="placesList"></datalist>

<script src="js/places.js"></script>
<script src="js/vacancies.js"></script>

<script>
function logout() {
  localStorage.clear();
  location.href = "index.html";
}
</script>

</body>
</html>
