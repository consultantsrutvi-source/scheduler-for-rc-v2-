<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vacancies | Scheduler for RC</title>
  <link rel="stylesheet" href="css/vacancies.css" />
</head>

<body>

<header class="topbar">
  <div class="brand">
    <img src="logo.png.jpg" alt="Rutvi Consultants" />
    <span>Scheduler for RC</span>
  </div>

  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a class="active" href="vacancies.html">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a href="assignments.html">Assignments</a>
  </nav>

  <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<main class="container">

  <div class="page-header">
    <h2>Vacancies</h2>

    <div class="actions">
      <button class="btn print" onclick="window.print()">🖨 Print</button>
      <button class="btn add" onclick="location.href='add-vacancy.html'">➕ Add Vacancy</button>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="filters">
    <input type="text" id="filterCollege" placeholder="Search College" />
    <input type="text" id="city" list="placesList" placeholder="Search / Select City" />

    <select id="filterSubject">
      <option value="">All Subjects</option>
      <option>Physics</option>
      <option>Chemistry</option>
      <option>Mathematics</option>
      <option>Biology</option>
      <option>Zoology</option>
      <option>Botany</option>
      <option>Others</option>
    </select>

    <select id="filterLevel">
      <option value="">All Levels</option>
      <option>Boards</option>
      <option>KCET</option>
      <option>NEET</option>
      <option>JEE Mains</option>
      <option>JEE Advanced</option>
      <option>Foundation</option>
    </select>

    <select id="filterUrgency">
      <option value="">All Urgency</option>
      <option>Immediate</option>
      <option>Within a week</option>
      <option>Normal</option>
    </select>

    <select id="filterStatus">
      <option value="">All Status</option>
      <option>Open</option>
      <option>Assigned</option>
      <option>Closed</option>
    </select>
  </div>
<select id="salaryFromFilter">
  <option value="">Min Salary</option>
  <option value="50000">₹50k</option>
  <option value="100000">₹1L</option>
  <option value="150000">₹1.5L</option>
  <option value="200000">₹2L</option>
</select>

<select id="salaryToFilter">
  <option value="">Max Salary</option>
  <option value="100000">₹1L</option>
  <option value="150000">₹1.5L</option>
  <option value="200000">₹2L</option>
  <option value="350000">₹3.5L</option>
</select>

  <!-- TABLE -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>College</th>
          <th>City</th>
          <th>Subject</th>
          <th>Level</th>
          <th>Salary</th>
          <th>Urgency</th>
          <th>Faculty</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="vacancyTable">
        <!-- JS injects rows -->
      </tbody>
    </table>
  </div>

</main>

<datalist id="citiesList"></datalist>

<script src="js/places.js"></script>
<script src="js/vacancies.js"></script>

<script>
function logout() {
  localStorage.clear();
  location.href = "index.html";
}
</script>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsT3dyPERKTfYhTf4BjCo8mzLrzYGxhLmS0MLfXnjX3hElLESnqchauzgxV87uJ4BOMA/exec";

async function loadVacancies() {
  try {
    const res = await fetch(SCRIPT_URL);
    const data = await res.json();

    const tbody = document.getElementById("vacancyTable");
    tbody.innerHTML = "";

    data.forEach(v => {
      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${v.id}</td>
        <td>${v.college}</td>
        <td>${v.city}</td>
        <td>${v.subject}</td>
        <td>${v.level}</td>
        <td>₹${v.salaryFrom} - ₹${v.salaryTo}</td>
        <td>${v.faculty}</td>
        <td><span class="status-badge ${v.status || 'open'}">${v.status || 'Open'}</span></td>
        <td>
          ✏️
          🗑️
        </td>
      `;

      tbody.appendChild(tr);
    });

  } catch (e) {
    console.error("Failed to load vacancies", e);
  }
}

document.addEventListener("DOMContentLoaded", loadVacancies);
</script>

<script>
  function applySalaryFilter() {
  const min = Number(document.getElementById("salaryFromFilter").value);
  const max = Number(document.getElementById("salaryToFilter").value);

  document.querySelectorAll("#vacanciesBody tr").forEach(row => {
    const salaryText = row.children[5].innerText;
    const numbers = salaryText.match(/\d+/g).map(Number);

    const from = numbers[0];
    const to = numbers[1];

    if (
      (min && from < min) ||
      (max && to > max)
    ) {
      row.style.display = "none";
    } else {
      row.style.display = "";
    }
  });
}

document.getElementById("salaryFromFilter").onchange = applySalaryFilter;
document.getElementById("salaryToFilter").onchange = applySalaryFilter;
  <script>
    <script>
async function deleteVacancy(id) {
  if (!confirm("Delete vacancy " + id + "?")) return;

  const res = await fetch(`${SCRIPT_URL}?id=${id}`, {
    method: "DELETE"
  });

  const result = await res.json();

  if (result.success) {
    alert("Vacancy deleted");
    loadVacancies();
  } else {
    alert("Delete failed: " + result.error);
  }
}
</script>

</body>
</html>
