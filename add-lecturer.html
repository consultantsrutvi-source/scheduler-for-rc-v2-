<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Lecturer | Scheduler for RC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Main Styles -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/add-vacancy.css" />

  <style>
    body {
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
    }
    .form-card {
      max-width: 1000px;
      margin: 40px auto;
      background: #ffffff;
      border-radius: 14px;
      padding: 28px 32px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    }
    .form-title {
      font-size: 26px;
      font-weight: 700;
      color: #1e3a8a;
      margin-bottom: 4px;
    }
    .form-subtitle {
      color: #64748b;
      margin-bottom: 24px;
    }
    .status-msg {
      margin-top: 14px;
      font-weight: 600;
    }
    .success { color: #15803d; }
    .error { color: #b91c1c; }
  </style>
</head>

<body class="app-body" onload="requireLogin()">

<!-- ================= HEADER ================= -->
<header class="app-header">
  <div class="header-left">
    <img src="logo.png.jpg" class="app-logo" />
    <span class="app-name">Scheduler for RC</span>
  </div>

  <nav class="header-nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lecturers.html" class="active">Lecturers</a>
    <a href="assignments.html">Assignments</a>
  </nav>

  <div class="nav-right">
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</header>

<!-- ================= FORM ================= -->
<main class="app-container">
  <div class="form-card">
    <div class="form-title">Add Lecturer</div>
    <div class="form-subtitle">Register available faculty for assignments</div>

    <form id="lecturerForm">
      <div class="form-grid">

        <div>
          <label>Name *</label>
          <input type="text" name="name" required />
        </div>

        <div>
          <label>Phone *</label>
          <input type="tel" name="phone" required />
        </div>

        <div>
          <label>City *</label>
          <input type="text" name="city" required />
        </div>

        <div>
          <label>Subject *</label>
          <select name="subject" required>
            <option value="">Select</option>
            <option>Physics</option>
            <option>Chemistry</option>
            <option>Biology</option>
            <option>Mathematics</option>
            <option>Other</option>
          </select>
        </div>

        <div>
          <label>Level *</label>
          <select name="level" required>
            <option value="">Select</option>
            <option>KCET</option>
            <option>Boards</option>
            <option>NEET</option>
            <option>JEE</option>
          </select>
        </div>

        <div>
          <label>Experience (Years)</label>
          <input type="number" name="experience" min="0" />
        </div>

        <div>
          <label>Salary From *</label>
          <select name="salaryFrom" required>
            <option value="">Select</option>
            <option value="50000">₹50k</option>
            <option value="100000">₹1L</option>
            <option value="150000">₹1.5L</option>
            <option value="200000">₹2L</option>
            <option value="250000">₹2.5L</option>
            <option value="300000">₹3L</option>
            <option value="350000">₹3.5L</option>
          </select>
        </div>

        <div>
          <label>Salary To *</label>
          <select name="salaryTo" required>
            <option value="">Select</option>
            <option value="50000">₹50k</option>
            <option value="100000">₹1L</option>
            <option value="150000">₹1.5L</option>
            <option value="200000">₹2L</option>
            <option value="250000">₹2.5L</option>
            <option value="300000">₹3L</option>
            <option value="350000">₹3.5L</option>
          </select>
        </div>

        <div>
          <label>Availability *</label>
          <select name="availability" required>
            <option>Immediate</option>
            <option>Within 1 Week</option>
            <option>Within 15 Days</option>
            <option>Within 1 Month</option>
          </select>
        </div>

        <div class="full">
          <label>Notes</label>
          <textarea name="notes" rows="3"></textarea>
        </div>
      </div>

      <button type="submit" class="primary-btn">
        💾 Save Lecturer
      </button>

      <div id="status" class="status-msg"></div>
    </form>
  </div>
</main>

<!-- ================= SCRIPT ================= -->
<script>
  const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";

  document.getElementById("lecturerForm").addEventListener("submit", async e => {
    e.preventDefault();
    const status = document.getElementById("status");
    status.textContent = "Saving lecturer...";
    status.className = "status-msg";

    const formData = new FormData(e.target);
    const payload = { type: "addLecturer" };
    formData.forEach((v, k) => payload[k] = v);

    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      const out = await res.json();

      if (out.success) {
        status.textContent = "✅ Lecturer saved successfully";
        status.classList.add("success");
        e.target.reset();
      } else {
        throw new Error();
      }
    } catch {
      status.textContent = "❌ Could not save lecturer";
      status.classList.add("error");
    }
  });

  function logout() {
    localStorage.clear();
    sessionStorage.clear();
    location.href = "index.html";
  }

  function requireLogin() {
    if (!localStorage.getItem("scheduler_session")) {
      location.href = "index.html";
    }
  }
</script>

</body>
</html>
