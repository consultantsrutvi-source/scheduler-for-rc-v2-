<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Lecturer | Scheduler for RC</title>

<!-- STYLES -->
<style>
:root{
  --grad: linear-gradient(135deg,#0ea5e9,#22c55e);
  --card:#ffffffee;
  --bg:#f1f5f9;
  --txt:#0f172a;
}
*{box-sizing:border-box;font-family:Inter,system-ui;}
body{
  margin:0;
  background:var(--bg);
  color:var(--txt);
}
header{
  background:var(--grad);
  color:#fff;
  padding:12px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
header .left{
  display:flex;
  align-items:center;
  gap:12px;
}
.logo{
  height:38px;
  width:38px;
  border-radius:12px;
  background:#fff;
  padding:4px;
  object-fit:cover;
}
nav a{
  color:#fff;
  margin-left:20px;
  text-decoration:none;
  font-weight:500;
}
main{
  padding:40px;
  display:flex;
  justify-content:center;
}
.card{
  background:var(--card);
  width:820px;
  border-radius:18px;
  padding:30px;
  box-shadow:0 20px 40px rgba(0,0,0,.08);
}
h2{
  margin-top:0;
  text-align:center;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
label{
  font-size:13px;
  font-weight:600;
}
input,select,textarea{
  width:100%;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid #cbd5e1;
}
textarea{resize:none;height:80px}
button{
  margin-top:22px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:var(--grad);
  color:#fff;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}
.msg{
  margin-top:16px;
  text-align:center;
  font-weight:600;
}
.success{color:#16a34a}
.error{color:#dc2626}
.hidden{display:none}
</style>
</head>

<body>

<header>
  <div class="left">
    <img src="logo.png.jpg" class="logo">
    <strong>Scheduler for RC</strong>
  </div>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a href="assignments.html">Assignments</a>
  </nav>
</header>

<main>
<div class="card">
<h2>Add Lecturer</h2>

<div class="grid">
  <div>
    <label>Name *</label>
    <input id="name">
  </div>
  <div>
    <label>Phone *</label>
    <input id="phone">
  </div>

  <div>
    <label>City *</label>
    <select id="city"></select>
  </div>

  <div>
    <label>Subject *</label>
    <select id="subject">
      <option value="">Select</option>
      <option>Physics</option>
      <option>Chemistry</option>
      <option>Biology</option>
      <option>Maths</option>
      <option value="Other">Other</option>
    </select>
    <input id="subjectOther" class="hidden" placeholder="Enter subject">
  </div>

  <div>
    <label>Level *</label>
    <select id="level">
      <option value="">Select</option>
      <option>KCET</option>
      <option>NEET</option>
      <option>Boards</option>
      <option>JEE</option>
      <option>Foundation</option>
      <option value="Other">Other</option>
    </select>
    <input id="levelOther" class="hidden" placeholder="Enter level">
  </div>

  <div>
    <label>Experience (Years)</label>
    <input id="experience" type="number">
  </div>

  <div>
    <label>Salary From *</label>
    <select id="salaryFrom"></select>
  </div>
  <div>
    <label>Salary To *</label>
    <select id="salaryTo"></select>
  </div>

  <div>
    <label>Availability *</label>
    <select id="availability">
      <option>Immediate</option>
      <option>Within 1 Week</option>
      <option>Within 15 Days</option>
      <option>Within 1 Month</option>
    </select>
  </div>

  <div>
    <label>Notes</label>
    <textarea id="notes"></textarea>
  </div>
</div>

<button onclick="saveLecturer()">Save Lecturer</button>
<div id="msg" class="msg"></div>

</div>
</main>

<!-- SCRIPTS -->
<script src="js/places.js"></script>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";

/* Cities */
document.addEventListener("DOMContentLoaded",()=>{
  const citySel = document.getElementById("city");
  citySel.innerHTML = '<option value="">Select</option>';
  cities.forEach(c=>{
    const o=document.createElement("option");
    o.textContent=c;
    citySel.appendChild(o);
  });

  const salary=[50000,75000,100000,125000,150000,200000,250000,300000,350000];
  ["salaryFrom","salaryTo"].forEach(id=>{
    const s=document.getElementById(id);
    s.innerHTML='<option value="">Select</option>';
    salary.forEach(v=>{
      const o=document.createElement("option");
      o.value=v;
      o.textContent="₹"+(v/1000)+"k";
      s.appendChild(o);
    });
  });
});

/* Other fields */
subject.onchange=()=>subjectOther.classList.toggle("hidden",subject.value!=="Other");
level.onchange=()=>levelOther.classList.toggle("hidden",level.value!=="Other");

/* SAVE */
function saveLecturer(){
  const data={
    name: document.getElementById("name").value.trim(),
    phone:phone.value,
    city:city.value,
    subject:subject.value==="Other"?subjectOther.value:subject.value,
    level:level.value==="Other"?levelOther.value:level.value,
    salaryFrom:salaryFrom.value,
    salaryTo:salaryTo.value,
    experience:experience.value,
    availability:availability.value,
    notes:notes.value
  };

  fetch(`${SCRIPT_URL}?action=addLecturer`,{
    method:"POST",
    body:JSON.stringify(data)
  })
  .then(r=>r.json())
  .then(res=>{
    if(res.success){
      msg.className="msg success";
      msg.innerText="Saved successfully! Lecturer ID: "+res.id;
      document.querySelectorAll("input,select,textarea").forEach(e=>e.value="");
      subjectOther.classList.add("hidden");
      levelOther.classList.add("hidden");
    }else{
      msg.className="msg error";
      msg.innerText="Could not save lecturer";
    }
  })
  .catch(()=>{
    msg.className="msg error";
    msg.innerText="Server error";
  });
}
</script>

</body>
</html>
