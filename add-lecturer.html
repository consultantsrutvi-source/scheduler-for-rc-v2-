<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Lecturer | Scheduler for RC</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;font-family:Inter}
body{margin:0;background:#f4f6f9;color:#222}

header{
  background:#fff;
  padding:12px 30px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 2px 10px rgba(0,0,0,.08)
}

.brand{display:flex;align-items:center;gap:12px}
.brand img{height:40px}
nav a{
  margin:0 12px;
  text-decoration:none;
  font-weight:600;
  color:#444
}
nav a.active{color:#2563eb}

.logout{
  background:#ef4444;color:#fff;
  border:none;padding:8px 14px;
  border-radius:6px;cursor:pointer
}

.container{
  max-width:850px;
  margin:40px auto;
  background:#fff;
  padding:30px;
  border-radius:14px;
  box-shadow:0 15px 40px rgba(0,0,0,.1)
}

h2{margin-top:0}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px
}

label{font-weight:600;font-size:14px}

input,select,textarea{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px
}

textarea{resize:none}

.full{grid-column:1/3}

button.save{
  margin-top:25px;
  width:100%;
  padding:14px;
  background:#2563eb;
  color:#fff;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:600;
  cursor:pointer
}

button.save:disabled{opacity:.6}

.status{text-align:center;margin-top:12px;font-weight:600}
</style>
</head>

<body>

<header>
  <div class="brand">
    <img src="logo.png.jpg">
    <strong>Scheduler for RC</strong>
  </div>

  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a class="active">Add Lecturer</a>
  </nav>

  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">
<h2>Add Lecturer</h2>

<form id="lecturerForm">
<div class="grid">

<div>
<label>Name</label>
<input id="lecName" required>
</div>

<div>
<label>Phone</label>
<input id="lecPhone" required>
</div>

<div>
<label>City</label>
<input id="lecCity" list="citiesList">
</div>

<div>
<label>Subject</label>
<select id="lecSubject">
<option>Physics</option>
<option>Chemistry</option>
<option>Biology</option>
<option>Mathematics</option>
</select>
</div>

<div>
<label>Level</label>
<select id="lecLevel">
<option>Boards</option>
<option>KCET</option>
<option>NEET</option>
<option>JEE</option>
</select>
</div>

<div>
<label>Experience (Years)</label>
<input id="experience" type="number">
</div>

<div>
<label>Salary From</label>
<select id="salaryFrom"></select>
</div>

<div>
<label>Salary To</label>
<select id="salaryTo"></select>
</div>

<div>
<label>Availability</label>
<select id="availability">
<option>Immediate</option>
<option>Within 1 Week</option>
<option>Within 15 Days</option>
<option>Within 1 Month</option>
</select>
</div>

<div class="full">
<label>Notes</label>
<textarea id="notes" rows="3"></textarea>
</div>

</div>

<button type="button" class="save" onclick="saveLecturer()">Save Lecturer</button>
<div class="status" id="status"></div>
</form>
</div>

<datalist id="citiesList"></datalist>

<script src="js/places.js"></script>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsT3dyPERKTfYhTf4BjCo8mzLrzYGxhLmS0MLfXnjX3hElLESnqchauzgxV87uJ4BOMA/exec";

function fillSalary(){
  const f=document.getElementById("salaryFrom");
  const t=document.getElementById("salaryTo");
  for(let i=50;i<=350;i+=25){
    const o1=new Option("₹"+i+"k",i*1000);
    const o2=new Option("₹"+i+"k",i*1000);
    f.add(o1); t.add(o2);
  }
}
fillSalary();

async function saveLecturer(){
  const btn=document.querySelector(".save");
  const status=document.getElementById("status");

  btn.disabled=true;
  status.innerText="Saving...";

  const payload={
    action:"addLecturer",
    name:lecName.value,
    phone:lecPhone.value,
    city:lecCity.value,
    subject:lecSubject.value,
    level:lecLevel.value,
    salaryFrom:salaryFrom.value,
    salaryTo:salaryTo.value,
    experience:experience.value,
    availability:availability.value,
    notes:notes.value
  };

  const res=await fetch(SCRIPT_URL,{
    method:"POST",
    body:JSON.stringify(payload)
  });

  const r=await res.json();

  if(r.success){
    status.innerText="Saved successfully ✔";
    lecturerForm.reset();
  }else{
    status.innerText="Error: "+r.error;
  }

  btn.disabled=false;
}

function logout(){
  localStorage.clear();
  location.href="index.html";
}
</script>

</body>
</html>
