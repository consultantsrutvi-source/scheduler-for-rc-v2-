<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Lecturer | Scheduler for RC</title>

<link rel="stylesheet" href="css/style.css">

<style>
body {
  background: linear-gradient(135deg,#eef2f7,#f9fbfd);
  font-family: "Segoe UI", sans-serif;
}

.container {
  max-width: 720px;
  margin: 40px auto;
  background: #fff;
  border-radius: 14px;
  padding: 28px;
  box-shadow: 0 20px 45px rgba(0,0,0,.08);
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 16px;
}

label {
  font-size: 13px;
  font-weight: 600;
}

input, select, textarea {
  width: 100%;
  padding: 9px 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

textarea { resize: vertical }

button {
  width: 100%;
  margin-top: 18px;
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
  background: linear-gradient(90deg,#4f8cff,#35c27b);
}

.status {
  margin-top: 12px;
  text-align: center;
  font-weight: 600;
}
.success { color: #1aa36f }
.error { color: #e74c3c }

.topbar {
  background: linear-gradient(90deg,#0f766e,#2563eb);
  padding: 14px 30px;
  color: #fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.topbar a {
  color:#fff;
  margin-left:18px;
  text-decoration:none;
  font-weight:500;
}
</style>
</head>

<body onload="requireLogin()">

<div class="topbar">
  <strong>Scheduler for RC</strong>
  <div>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a href="assignments.html">Assignments</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>
</div>

<div class="container">
<h2>Add Lecturer</h2>

<div class="grid">
  <div>
    <label>Name *</label>
    <input id="name">
  </div>
  <div>
    <label>Phone *</label>
    <input id="phone">
  </div>

  <div>
    <label>City *</label>
    <select id="city"></select>
  </div>

  <div>
    <label>Subject *</label>
    <select id="subject">
      <option value="">Select</option>
      <option>Physics</option>
      <option>Chemistry</option>
      <option>Biology</option>
      <option>Maths</option>
      <option>Other</option>
    </select>
  </div>

  <div>
    <label>Level *</label>
    <select id="level">
      <option value="">Select</option>
      <option>KCET</option>
      <option>NEET</option>
      <option>Boards</option>
      <option>Other</option>
    </select>
  </div>

  <div>
    <label>Experience (Years)</label>
    <input id="experience" type="number">
  </div>

  <div>
    <label>Salary From *</label>
    <select id="salaryFrom"></select>
  </div>

  <div>
    <label>Salary To *</label>
    <select id="salaryTo"></select>
  </div>

  <div>
    <label>Availability *</label>
    <select id="availability">
      <option>Immediate</option>
      <option>Within 1 Week</option>
      <option>Within 15 Days</option>
    </select>
  </div>

  <div>
    <label>Notes</label>
    <textarea id="notes"></textarea>
  </div>
</div>

<button onclick="saveLecturer()">Save Lecturer</button>
<div id="msg" class="status"></div>

</div>

<script src="js/places.js"></script>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";

function requireLogin(){
  if(!sessionStorage.getItem("scheduler_session")){
    location.href="index.html";
  }
}

function logout(){
  sessionStorage.clear();
  location.href="index.html";
}

const salaryOptions = [50000,75000,100000,125000,150000,200000,250000,300000,350000];

function loadSalary(){
  ["salaryFrom","salaryTo"].forEach(id=>{
    const s=document.getElementById(id);
    s.innerHTML='<option value="">Select</option>';
    salaryOptions.forEach(v=>{
      const o=document.createElement("option");
      o.value=v;
      o.textContent="₹"+(v/1000)+"k";
      s.appendChild(o);
    });
  });
}
loadSalary();

async function saveLecturer(){
  const data={
    name:name.value,
    phone:phone.value,
    city:city.value,
    subject:subject.value,
    level:level.value,
    experience:Number(experience.value||0),
    salaryFrom:Number(salaryFrom.value),
    salaryTo:Number(salaryTo.value),
    availability:availability.value,
    notes:notes.value
  };

  try{
    const res=await fetch(SCRIPT_URL+"?action=addLecturer",{
      method:"POST",
      body:JSON.stringify(data)
    });
    const j=await res.json();
    if(j.success){
      msg.className="status success";
      msg.innerText="Saved ✔ Lecturer ID: "+j.id;
      document.querySelectorAll("input,select,textarea").forEach(e=>e.value="");
    }else throw j;
  }catch{
    msg.className="status error";
    msg.innerText="Could not save lecturer";
  }
}
</script>

</body>
</html>
