<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Add Vacancy | Rutvi Consultants</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Styles -->
<style>
body{
  margin:0;
  font-family: Inter, Arial, sans-serif;
  background: linear-gradient(135deg,#eef4ff,#f7fbff);
}

header{
  height:58px;
  background: linear-gradient(90deg,#0f766e,#2563eb);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  color:#fff;
}

header .left{
  display:flex;
  align-items:center;
  gap:10px;
}

header img{
  height:36px;
}

nav a{
  color:#fff;
  text-decoration:none;
  margin-left:20px;
  font-weight:500;
}

.container{
  max-width:960px;
  margin:40px auto;
}

.card{
  background:rgba(255,255,255,0.95);
  border-radius:16px;
  padding:30px;
  box-shadow:0 20px 45px rgba(0,0,0,.15);
}

h2{
  text-align:center;
  margin-bottom:24px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

label{
  font-size:13px;
  font-weight:600;
  margin-bottom:6px;
  display:block;
}

input,select,textarea{
  width:100%;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid #cfd8e3;
  font-size:14px;
}

textarea{resize:none;height:70px;}

.full{grid-column:1/-1;}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#2563eb,#0f766e);
  color:#fff;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

button:disabled{opacity:.6}

.status{
  margin-top:12px;
  text-align:center;
  font-weight:600;
}
.success{color:#15803d}
.error{color:#b91c1c}
</style>
</head>

<body>

<header>
  <div class="left">
    <img src="logo.png.jpg" alt="Rutvi Consultants" />
    <strong>Rutvi Consultants – CRM</strong>
  </div>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a href="assignments.html">Assignments</a>
  </nav>
</header>

<div class="container">
  <div class="card">
    <h2>Add Vacancy</h2>

    <div class="grid">

      <div>
        <label>College Name *</label>
        <input id="college" />
      </div>

      <div>
        <label>City *</label>
        <select id="city"></select>
      </div>

      <div>
        <label>Phone *</label>
        <input id="phone" />
      </div>

      <div>
        <label>Subject *</label>
        <select id="subject">
          <option value="">Select</option>
          <option>Physics</option>
          <option>Chemistry</option>
          <option>Maths</option>
          <option>Biology</option>
          <option>Other</option>
        </select>
        <input id="subjectOther" placeholder="Enter subject"
               style="display:none;margin-top:6px;" />
      </div>

      <div>
        <label>Level *</label>
        <select id="level">
          <option value="">Select</option>
          <option>KCET</option>
          <option>NEET</option>
          <option>Boards</option>
          <option>JEE</option>
          <option>Foundation</option>
          <option>Other</option>
        </select>
        <input id="levelOther" placeholder="Enter level"
               style="display:none;margin-top:6px;" />
      </div>

      <div>
        <label>Faculty Required *</label>
        <input id="faculty" type="number" />
      </div>

      <div>
        <label>Salary From *</label>
        <select id="salaryFrom"></select>
      </div>

      <div>
        <label>Salary To *</label>
        <select id="salaryTo"></select>
      </div>

      <div>
        <label>Urgency *</label>
        <select id="urgency">
          <option value="">Select</option>
          <option>Immediate</option>
          <option>Within 7 Days</option>
          <option>Within 15 Days</option>
        </select>
      </div>

      <div>
        <label>Collected By *</label>
        <input id="collectedBy" />
      </div>

      <div class="full">
        <label>Notes</label>
        <textarea id="notes"></textarea>
      </div>

      <div class="full">
        <button onclick="saveVacancy()">Save Vacancy</button>
        <div id="msg" class="status"></div>
      </div>

    </div>
  </div>
</div>

<!-- Cities -->
<script src="js/places.js"></script>

<script>
const salaryOptions = [
  ["50000","₹50k"],["75000","₹75k"],["100000","₹1L"],
  ["150000","₹1.5L"],["200000","₹2L"],
  ["250000","₹2.5L"],["300000","₹3L"],["350000","₹3.5L"]
];

function fillSalary(){
  salaryOptions.forEach(s=>{
    salaryFrom.add(new Option(s[1],s[0]));
    salaryTo.add(new Option(s[1],s[0]));
  });
}

fillSalary();

subject.onchange=()=>subjectOther.style.display=
  subject.value==="Other"?"block":"none";

level.onchange=()=>levelOther.style.display=
  level.value==="Other"?"block":"none";

function saveVacancy(){
  msg.textContent="Saving...";
  msg.className="status";

  const data={
    college:college.value,
    city:city.value,
    phone:phone.value,
    subject:subject.value==="Other"?subjectOther.value:subject.value,
    level:level.value==="Other"?levelOther.value:level.value,
    faculty:faculty.value,
    salaryFrom:salaryFrom.value,
    salaryTo:salaryTo.value,
    urgency:urgency.value,
    collectedBy:collectedBy.value,
    notes:notes.value
  };

  fetch("YOUR_SCRIPT_URL_HERE?action=addVacancy",{
    method:"POST",
    body:JSON.stringify(data)
  })
  .then(r=>r.json())
  .then(res=>{
    if(res.success){
      msg.textContent="Saved! Vacancy ID: "+res.id;
      msg.className="status success";
      document.querySelectorAll("input,select,textarea")
        .forEach(e=>e.value="");
    }else{
      throw "Save failed";
    }
  })
  .catch(()=>{
    msg.textContent="Could not save vacancy";
    msg.className="status error";
  });
}
</script>

</body>
</html>
