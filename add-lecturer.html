<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Add Lecturer | Scheduler for RC</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  margin: 0;
}
header {
  background: #fff;
  padding: 12px 24px;
  border-bottom: 1px solid #ddd;
  display: flex;
  justify-content: space-between;
}
main {
  padding: 24px;
}
form {
  background: #fff;
  max-width: 700px;
  margin: auto;
  padding: 20px;
  border-radius: 6px;
}
label {
  display: block;
  margin-top: 12px;
  font-weight: 600;
}
input, select, textarea {
  width: 100%;
  padding: 8px;
  margin-top: 6px;
}
button {
  margin-top: 16px;
  padding: 10px 16px;
  border: none;
  background: #1976d2;
  color: white;
  cursor: pointer;
}
.status {
  margin-top: 12px;
  font-weight: 600;
}
</style>
</head>

<body>

<header>
  <strong>Add Lecturer</strong>
  <button onclick="location.href='lecturers.html'">Back</button>
</header>

<main>
<form id="lecturerForm">
  <label>Name</label>
  <input required id="name">

  <label>Phone</label>
  <input required id="phone">

  <label>City</label>
  <input required id="city" list="citiesList">
  <datalist id="citiesList"></datalist>

  <label>Subject</label>
  <select required id="subject">
    <option>Physics</option>
    <option>Chemistry</option>
    <option>Mathematics</option>
    <option>Biology</option>
    <option>Zoology</option>
    <option>Botany</option>
  </select>

  <label>Level</label>
  <select required id="level">
    <option>Boards</option>
    <option>KCET</option>
    <option>NEET</option>
    <option>JEE</option>
    <option>Foundation</option>
  </select>

  <label>Min Salary (₹)</label>
  <input type="number" id="minSalary" required>

  <label>Max Salary (₹)</label>
  <input type="number" id="maxSalary" required>

  <label>Experience (Years)</label>
  <input type="number" id="experience" required>

  <label>Availability</label>
  <select id="availability">
    <option>Immediate</option>
    <option>Within 1 Week</option>
    <option>Within 15 Days</option>
    <option>Within 1 Month</option>
  </select>

  <label>Notes</label>
  <textarea id="notes"></textarea>

  <button type="submit">Save Lecturer</button>
  <div class="status" id="status"></div>
</form>
</main>

<script src="js/places.js"></script>

<script>
const SCRIPT_URL = "PASTE_YOUR_APPS_SCRIPT_URL";

document.getElementById("lecturerForm").addEventListener("submit", async e => {
  e.preventDefault();
  document.getElementById("status").innerText = "Saving...";

  const payload = {
    type: "addLecturer",
    name: name.value,
    phone: phone.value,
    city: city.value,
    subject: subject.value,
    level: level.value,
    minSalary: minSalary.value,
    maxSalary: maxSalary.value,
    experience: experience.value,
    availability: availability.value,
    notes: notes.value
  };

  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify(payload)
  });

  const data = await res.json();

  if (data.success) {
    document.getElementById("status").innerText = "Saved! ID: " + data.id;
    document.getElementById("lecturerForm").reset();
  } else {
    document.getElementById("status").innerText = "Failed to save";
  }
});
</script>

</body>
</html>
