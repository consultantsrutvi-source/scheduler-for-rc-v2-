<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scheduler Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#eef2ff,#f8fafc);
    font-family:Inter,Arial,sans-serif
  }
  .card{
    background:#fff;border-radius:18px;padding:36px 40px;
    box-shadow:0 30px 60px rgba(0,0,0,.12);text-align:center;width:360px
  }
  img{height:56px;margin-bottom:14px}
  h1{margin:8px 0 6px;font-size:22px;color:#1e3a8a}
  p{color:#64748b;margin-bottom:18px}
  .pin{display:flex;gap:12px;justify-content:center}
  .pin input{
    width:44px;height:56px;font-size:22px;text-align:center;border-radius:12px;
    border:1.5px solid #c7d2fe;outline:none
  }
  .pin input:focus{border-color:#6366f1}
  button{
    margin-top:18px;width:100%;padding:12px;border-radius:12px;border:none;
    background:#4f46e5;color:#fff;font-weight:600;cursor:pointer
  }
  .err{color:#b91c1c;margin-top:10px}
</style>
</head>
<body>

<div class="card">
  <img src="logo.png.jpg" alt="Logo">
  <h1>Scheduler</h1>
  <p>Enter 4-digit PIN</p>

  <div class="pin">
    <input maxlength="1" inputmode="numeric">
    <input maxlength="1" inputmode="numeric">
    <input maxlength="1" inputmode="numeric">
    <input maxlength="1" inputmode="numeric">
  </div>

  <button onclick="login()">Login</button>
  <div id="err" class="err"></div>
</div>

<script>
  const PIN = "3011"; // change if needed
  const boxes = document.querySelectorAll('.pin input');
  boxes[0].focus();

  boxes.forEach((b,i)=>{
    b.addEventListener('input',()=>{
      if(b.value && i<boxes.length-1) boxes[i+1].focus();
    });
    b.addEventListener('keydown',e=>{
      if(e.key==='Backspace' && !b.value && i>0) boxes[i-1].focus();
    });
  });

  function login(){
    const entered = [...boxes].map(b=>b.value).join('');
    if(entered===PIN){
      localStorage.setItem('scheduler_session','active');
      location.href='dashboard.html';
    }else{
      document.getElementById('err').textContent='Invalid PIN';
      boxes.forEach(b=>b.value=''); boxes[0].focus();
    }
  }
</script>
</body>
</html>
