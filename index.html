<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | Scheduler CRM</title>

<style>
:root{
  --primary:#2563eb;
  --secondary:#1e40af;
  --bg1:#1e3a8a;
  --bg2:#2563eb;
  --card:#ffffff;
  --text:#1f2937;
  --error:#dc2626;
}
*{box-sizing:border-box;font-family:Inter,Arial,sans-serif}

body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
}

/* LOGIN CARD */
.login-card{
  background:var(--card);
  width:360px;
  padding:40px 36px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 30px 60px rgba(0,0,0,.35);
  animation:fadeIn .4s ease;
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

.login-card img{
  height:56px;
  margin-bottom:20px;
}

.login-card h2{
  margin:0 0 8px;
  color:var(--text);
}
.login-card p{
  margin:0 0 28px;
  color:#6b7280;
  font-size:14px;
}

/* PIN INPUTS */
.pin-wrapper{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-bottom:24px;
}
.pin-wrapper input{
  width:56px;
  height:64px;
  border-radius:14px;
  border:2px solid #c7d2fe;
  text-align:center;
  font-size:26px;
  font-weight:600;
  outline:none;
  transition:.2s;
}
.pin-wrapper input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(37,99,235,.25);
}

/* BUTTON */
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 12px 24px rgba(37,99,235,.4);
}
button:hover{opacity:.95}

/* MESSAGE */
.msg{
  margin-top:14px;
  font-size:14px;
  color:var(--error);
}
</style>
</head>

<body>

<div class="login-card">
  <img src="logo.png.jpg" alt="Logo">
  <h2>Scheduler CRM</h2>
  <p>Enter your 4-digit PIN</p>

  <div class="pin-wrapper">
    <input type="password" maxlength="1" inputmode="numeric">
    <input type="password" maxlength="1" inputmode="numeric">
    <input type="password" maxlength="1" inputmode="numeric">
    <input type="password" maxlength="1" inputmode="numeric">
  </div>

  <button onclick="login()">Login</button>
  <div class="msg" id="msg"></div>
</div>

<script>
const CORRECT_PIN = "3011";

/* AUTO REDIRECT IF SESSION EXISTS */
if(localStorage.getItem("scheduler_session")==="active"){
  location.replace("dashboard.html");
}

/* iPad-style auto move + backspace */
const inputs = document.querySelectorAll(".pin-wrapper input");
inputs.forEach((input,idx)=>{
  input.addEventListener("input",()=>{
    if(input.value && idx < inputs.length-1){
      inputs[idx+1].focus();
    }
  });
  input.addEventListener("keydown",(e)=>{
    if(e.key==="Backspace" && !input.value && idx>0){
      inputs[idx-1].focus();
    }
  });
});
inputs[0].focus();

/* LOGIN */
function login(){
  let pin="";
  inputs.forEach(i=>pin+=i.value);

  if(pin.length<4){
    showMsg("Enter complete PIN");
    return;
  }

  if(pin===CORRECT_PIN){
    localStorage.setItem("scheduler_session","active");
    location.replace("dashboard.html");
  }else{
    showMsg("Invalid PIN");
    inputs.forEach(i=>i.value="");
    inputs[0].focus();
  }
}

function showMsg(txt){
  document.getElementById("msg").innerText = txt;
}
</script>

</body>
</html>
