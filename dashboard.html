<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard | Scheduler</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --blue:#2563eb;--indigo:#4f46e5;--green:#10b981;--orange:#f59e0b;--pink:#ec4899;
  --bg:#f4f6fb;--card:#fff;--text:#1f2937
}
*{box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{margin:0;background:var(--bg);color:var(--text)}
header{
  background:linear-gradient(135deg,var(--blue),var(--indigo));
  color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between
}
header .left{display:flex;align-items:center;gap:14px}
header img{height:36px}
nav a{color:#fff;text-decoration:none;margin-right:14px;font-weight:500}
nav a:hover{text-decoration:underline}
.logout{background:#ef4444;border:none;color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer}
main{padding:28px}
h1{margin-bottom:18px}

.stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;margin-bottom:28px
}
.stat{
  background:var(--card);border-radius:16px;padding:22px;
  box-shadow:0 18px 36px rgba(0,0,0,.08)
}
.stat h3{margin:0;color:#374151;font-size:15px}
.stat .n{font-size:36px;font-weight:800;margin-top:10px}

.actions{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px
}
.card{
  border-radius:18px;padding:26px;color:#fff;text-decoration:none;
  box-shadow:0 18px 36px rgba(0,0,0,.22);transition:.2s
}
.card:hover{transform:translateY(-5px)}
.c1{background:linear-gradient(135deg,#2563eb,#1e40af)}
.c2{background:linear-gradient(135deg,#10b981,#059669)}
.c3{background:linear-gradient(135deg,#f59e0b,#d97706)}
</style>
</head>
<body onload="requireLogin();loadCounts()">

<header>
  <div class="left">
    <img src="logo.png.jpg">
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="vacancies.html">Vacancies</a>
      <a href="lecturers.html">Lecturers</a>
      <a href="assignments.html">Assignments</a>
    </nav>
  </div>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<main>
  <h1>Dashboard</h1>

  <div class="stats">
    <div class="stat"><h3>Total Vacancies</h3><div id="vacCount" class="n">—</div></div>
    <div class="stat"><h3>Active Lecturers</h3><div id="lecCount" class="n">—</div></div>
    <div class="stat"><h3>Assignments Today</h3><div id="asgToday" class="n">—</div></div>
  </div>

  <div class="actions">
    <a class="card c1" href="add-vacancy.html"><h3>Add Vacancy</h3></a>
    <a class="card c2" href="add-lecturer.html"><h3>Add Lecturer</h3></a>
    <a class="card c3" href="assignments.html"><h3>Manual Assignment</h3></a>
  </div>
</main>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";

function requireLogin(){
  if(!localStorage.getItem('scheduler_session')) location.href='index.html';
}
function logout(){
  localStorage.clear(); sessionStorage.clear(); location.href='index.html';
}
async function loadCounts(){
  try{
    const r=await fetch(SCRIPT_URL+'?action=getCounts');
    const d=await r.json();
    document.getElementById('vacCount').textContent=d.vacancies ?? '0';
    document.getElementById('lecCount').textContent=d.lecturers ?? '0';
    document.getElementById('asgToday').textContent=d.assignmentsToday ?? '0';
  }catch(e){
    document.getElementById('vacCount').textContent='—';
    document.getElementById('lecCount').textContent='—';
    document.getElementById('asgToday').textContent='—';
  }
}
</script>
</body>
</html>
