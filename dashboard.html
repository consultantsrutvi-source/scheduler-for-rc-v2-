<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard | Scheduler CRM</title>

<style>
:root{
  --primary:#2563eb;
  --bg:#f4f6fb;
  --card:#ffffff;
  --text:#1f2937;
  --danger:#ef4444;
}
*{box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{margin:0;background:var(--bg);color:var(--text)}

header{
  background:linear-gradient(135deg,#2563eb,#1e40af);
  color:#fff;
  padding:16px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between
}
header img{height:36px}
header nav a{
  color:#fff;
  text-decoration:none;
  margin-right:16px;
  font-weight:500
}
header button{
  background:var(--danger);
  border:none;
  color:#fff;
  padding:8px 14px;
  border-radius:6px;
  cursor:pointer
}

main{padding:32px}

h1{margin-bottom:24px}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px
}

.card{
  background:var(--card);
  border-radius:12px;
  padding:24px;
  box-shadow:0 12px 24px rgba(0,0,0,.08);
  transition:transform .2s
}
.card:hover{transform:translateY(-4px)}

.card h2{
  margin:0;
  font-size:18px;
  color:#374151
}
.card .count{
  font-size:36px;
  font-weight:700;
  margin-top:12px;
  color:var(--primary)
}
.card small{
  color:#6b7280
}

.quick{
  margin-top:32px;
  display:flex;
  gap:16px;
  flex-wrap:wrap
}
.quick a{
  background:var(--primary);
  color:#fff;
  padding:12px 18px;
  border-radius:8px;
  text-decoration:none;
  font-weight:500
}
</style>
</head>

<body>

<header>
  <div style="display:flex;align-items:center;gap:16px">
    <img src="logo.png.jpg" alt="Logo">
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="vacancies.html">Vacancies</a>
      <a href="add-vacancy.html">Add Vacancy</a>
      <a href="lecturers.html">Lecturers</a>
    </nav>
  </div>
  <button onclick="logout()">Logout</button>
</header>

<main>

<h1>Dashboard</h1>

<div class="grid">
  <div class="card">
    <h2>Total Vacancies</h2>
    <div class="count" id="totalVacancies">0</div>
    <small>All active job requirements</small>
  </div>

  <div class="card">
    <h2>Active Lecturers</h2>
    <div class="count" id="activeLecturers">0</div>
    <small>Available faculty pool</small>
  </div>

  <div class="card">
    <h2>Assignments Today</h2>
    <div class="count">0</div>
    <small>To be enabled</small>
  </div>

  <div class="card">
    <h2>Pending Matches</h2>
    <div class="count">0</div>
    <small>Auto-matching queue</small>
  </div>
</div>

<div class="quick">
  <a href="add-vacancy.html">➕ Add Vacancy</a>
  <a href="vacancies.html">📋 View Vacancies</a>
  <a href="lecturers.html">👨‍🏫 View Lecturers</a>
</div>

</main>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";

function logout(){
  localStorage.clear();
  location.href="index.html";
}

async function loadDashboard(){
  const res = await fetch(SCRIPT_URL + "?action=getDashboard");
  const data = await res.json();

  document.getElementById("totalVacancies").innerText = data.totalVacancies || 0;
  document.getElementById("activeLecturers").innerText = data.activeLecturers || 0;
}

loadDashboard();
</script>

</body>
</html>
