<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Vacancy | Scheduler CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="places.js"></script>

<style>
:root{
  --bg:#f4f7ff;
  --card:#ffffff;
  --text:#1f2937;
  --blue:#6366f1;
  --green:#22c55e;
  --orange:#f59e0b;
  --red:#ef4444;
}
*{box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{margin:0;background:var(--bg);color:var(--text)}

header{
  background:linear-gradient(135deg,#eef2ff,#ffffff);
  padding:14px 26px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #e5e7eb
}
header img{height:38px}
nav a{
  margin-right:16px;
  text-decoration:none;
  color:#374151;
  font-weight:500
}
nav a:hover{color:var(--blue)}
.logout{
  background:#ef4444;
  border:none;
  color:#fff;
  padding:8px 16px;
  border-radius:10px;
  cursor:pointer;
  font-weight:600
}

main{
  max-width:900px;
  margin:30px auto;
  background:var(--card);
  padding:32px;
  border-radius:20px;
  box-shadow:0 25px 50px rgba(0,0,0,.12)
}
h1{margin-bottom:24px}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px
}
label{font-weight:600;font-size:14px}
input,select{
  width:100%;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid #d1d5db;
  font-size:14px
}
.hidden{display:none}

.actions{
  margin-top:28px;
  display:flex;
  gap:16px;
  align-items:center
}
button{
  padding:12px 26px;
  border-radius:14px;
  border:none;
  font-size:16px;
  font-weight:700;
  cursor:pointer
}
.save{
  background:linear-gradient(135deg,#6366f1,#818cf8);
  color:#fff
}
.save:disabled{opacity:.6}
.status{
  font-weight:600
}
.success{color:var(--green)}
.error{color:var(--red)}
</style>
</head>

<body onload="requireLogin();loadCities()">

<header>
  <div>
    <img src="logo.png.jpg">
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="vacancies.html">Vacancies</a>
      <a href="lecturers.html">Lecturers</a>
    </nav>
  </div>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<main>
<h1>Add Vacancy</h1>

<div class="form-grid">

  <div>
    <label>College Name *</label>
    <input id="college" required>
  </div>

  <div>
    <label>City *</label>
    <select id="city"></select>
  </div>

  <div>
    <label>Subject *</label>
    <select id="subject" onchange="toggleOther(this,'subjectOther')">
      <option value="">Select</option>
      <option>Physics</option>
      <option>Chemistry</option>
      <option>Mathematics</option>
      <option>Biology</option>
      <option>Botany</option>
      <option>Zoology</option>
      <option>Other</option>
    </select>
    <input id="subjectOther" class="hidden" placeholder="Enter subject">
  </div>

  <div>
    <label>Level *</label>
    <select id="level" onchange="toggleOther(this,'levelOther')">
      <option value="">Select</option>
      <option>PU</option>
      <option>KCET</option>
      <option>NEET</option>
      <option>JEE</option>
      <option>Foundation</option>
      <option>Other</option>
    </select>
    <input id="levelOther" class="hidden" placeholder="Enter level">
  </div>

  <div>
    <label>Salary From *</label>
    <select id="salaryFrom"></select>
  </div>

  <div>
    <label>Salary To *</label>
    <select id="salaryTo"></select>
  </div>

  <div>
    <label>Urgency *</label>
    <select id="urgency">
      <option value="">Select</option>
      <option>Immediate</option>
      <option>Within 1 Week</option>
      <option>Within 1 Month</option>
    </select>
  </div>

  <div>
    <label>Phone</label>
    <input id="phone">
  </div>

</div>

<div class="actions">
  <button class="save" onclick="saveVacancy()">Save Vacancy</button>
  <span id="status" class="status"></span>
</div>

</main>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";

function requireLogin(){
  if(!localStorage.getItem("scheduler_session")){
    location.href="index.html";
  }
}
function logout(){
  localStorage.clear();
  location.href="index.html";
}

function loadCities(){
  const c=document.getElementById("city");
  c.innerHTML='<option value="">Select</option>';
  cities.forEach(x=>{
    const o=document.createElement("option");
    o.textContent=x;o.value=x;c.appendChild(o);
  });

  for(let s=50000;s<=350000;s+=25000){
    salaryFrom.innerHTML+=`<option>${s}</option>`;
    salaryTo.innerHTML+=`<option>${s}</option>`;
  }
}

function toggleOther(sel,id){
  document.getElementById(id).classList.toggle("hidden",sel.value!=="Other");
}

async function saveVacancy(){
  const status=document.getElementById("status");
  status.textContent="Saving...";
  status.className="status";

  const data={
    action:"addVacancy",
    college:college.value.trim(),
    city:city.value,
    subject:subject.value==="Other"?subjectOther.value:subject.value,
    level:level.value==="Other"?levelOther.value:level.value,
    salaryFrom:salaryFrom.value,
    salaryTo:salaryTo.value,
    urgency:urgency.value,
    phone:phone.value
  };

  if(!data.college||!data.city||!data.subject||!data.level||!data.salaryFrom||!data.salaryTo||!data.urgency){
    status.textContent="Please fill all mandatory fields";
    status.classList.add("error");
    return;
  }

  try{
    const res=await fetch(SCRIPT_URL,{
      method:"POST",
      body:JSON.stringify(data)
    });
    const r=await res.json();
    if(r.success){
      status.textContent="Vacancy saved successfully";
      status.classList.add("success");
    }else{
      status.textContent=r.message||"Could not save vacancy";
      status.classList.add("error");
    }
  }catch(e){
    status.textContent="Server error while saving";
    status.classList.add("error");
  }
}
</script>

</body>
</html>
