<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Vacancy | Rutvi Consultants</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
  font-family: "Segoe UI", system-ui, sans-serif;
}

body {
  margin: 0;
  background: #f4f6f9;
  color: #333;
}

/* ===== NAVBAR ===== */
.navbar {
  background: #ffffff;
  border-bottom: 1px solid #e0e0e0;
  padding: 12px 26px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.nav-left img {
  height: 42px;
}

.nav-left span {
  font-weight: 600;
  font-size: 15px;
}

.nav-links a {
  margin-right: 18px;
  text-decoration: none;
  font-size: 14px;
  color: #444;
  font-weight: 500;
}

.nav-links a.active {
  color: #1976d2;
  font-weight: 600;
}

.logout-btn {
  background: #e53935;
  color: white;
  border: none;
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
}

/* ===== PAGE ===== */
.container {
  max-width: 1100px;
  margin: 32px auto;
  padding: 0 20px;
}

.card {
  background: #fff;
  border-radius: 14px;
  padding: 28px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.06);
}

.card h2 {
  margin-top: 0;
  font-size: 22px;
  font-weight: 600;
}

/* ===== FORM ===== */
.form-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  margin-top: 20px;
}

.form-group {
  display: flex;
  flex-direction: column;
}

.form-group.full {
  grid-column: span 3;
}

label {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
}

input, select, textarea {
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 14px;
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: #1976d2;
}

.actions {
  display: flex;
  justify-content: flex-end;
  margin-top: 24px;
}

button.save-btn {
  background: linear-gradient(135deg, #1976d2, #0d47a1);
  color: #fff;
  border: none;
  padding: 12px 26px;
  font-size: 15px;
  border-radius: 10px;
  cursor: pointer;
}

button.save-btn:hover {
  opacity: 0.9;
}
<div id="saveStatus" style="margin-top:10px;font-weight:600;"></div>


/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
  .form-grid { grid-template-columns: repeat(2, 1fr); }
  .form-group.full { grid-column: span 2; }
}

@media (max-width: 600px) {
  .form-grid { grid-template-columns: 1fr; }
  .form-group.full { grid-column: span 1; }
}
</style>
</head>

<body>

<!-- ===== NAVBAR ===== -->
<div class="navbar">
  <div class="nav-left">
    <!-- 🔴 CHANGE PATH IF NEEDED -->
    <img src="logo.png.jpg" alt="Rutvi Consultants">
    <span>Scheduler for RC</span>
  </div>

  <div class="nav-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a href="assignments.html">Assignments</a>
  </div>

  <button class="logout-btn" onclick="alert('Logout logic later')">Logout</button>
</div>

<!-- ===== PAGE ===== -->
<div class="container">
  <div class="card">
    <h2>Add Vacancy</h2>
    <p style="color:#666">Enter college faculty requirement details</p>

    <form>

      <div class="form-grid">

        <div class="form-group">
          <label>College Name *</label>
          <input required>
        </div>

        <div class="form-group">
          <label>City *</label>
<input 
  type="text" 
  id="city" 
  list="citiesList" 
  placeholder="Search / Select City" 
  required
>

<datalist id="citiesList"></datalist>

        </div>

        <div class="form-group">
          <label>Phone *</label>
          <input required>
        </div>

        <div class="form-group">
          <label>Subject *</label>
          <select required>
            <option value="">Select</option>
            <option>Physics</option>
            <option>Chemistry</option>
            <option>Mathematics</option>
            <option>Biology</option>
            <option>Botany</option>
            <option>Zoology</option>
            <option>Others</option>
          </select>
        </div>

        <div class="form-group">
          <label>Level *</label>
          <select required>
            <option value="">Select</option>
            <option>Boards</option>
            <option>KCET</option>
            <option>NEET</option>
            <option>JEE Main</option>
            <option>JEE Advanced</option>
            <option>Foundation</option>
          </select>
        </div>

        <div class="form-group">
          <label>Faculty Required *</label>
          <input type="number" min="1" required>
        </div>

        <div class="form-group">
          <label>Salary From *</label>
          <select required>
            <option value="">Select</option>
            <option>₹50,000</option>
            <option>₹75,000</option>
            <option>₹1,00,000</option>
            <option>₹1,50,000</option>
            <option>₹2,00,000</option>
            <option>₹2,50,000</option>
            <option>₹3,00,000</option>
            <option>₹3,50,000</option>
          </select>
        </div>

        <div class="form-group">
          <label>Salary To *</label>
          <select required>
            <option value="">Select</option>
            <option>₹75,000</option>
            <option>₹1,00,000</option>
            <option>₹1,50,000</option>
            <option>₹2,00,000</option>
            <option>₹2,50,000</option>
            <option>₹3,00,000</option>
            <option>₹3,50,000</option>
          </select>
        </div>

        <div class="form-group">
          <label>Urgency *</label>
          <select required>
            <option>Immediate</option>
            <option>Within 1 Week</option>
            <option>Within 15 Days</option>
            <option>Not Urgent</option>
          </select>
        </div>

        <div class="form-group">
          <label>Collected By *</label>
          <input required>
        </div>

        <div class="form-group full">
          <label>Notes</label>
          <textarea rows="3"></textarea>
        </div>

      </div>

      <div class="actions">
        <button class="save-btn">💾 Save Vacancy</button>
      </div>

    </form>
    
  </div>
</div>
<script src="js/places.js"></script>
<div id="saveStatus" style="margin-top:12px;font-weight:600;"></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsT3dyPERKTfYhTf4BjCo8mzLrzYGxhLmS0MLfXnjX3hElLESnqchauzgxV87uJ4BOMA/exec";

/* save vacancy logic */
document.getElementById("vacancyForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const status = document.getElementById("saveStatus");
  status.style.color = "#555";
  status.innerText = "⏳ Saving vacancy, please wait...";

  const payload = {
    college: document.getElementById("college").value,
    city: document.getElementById("city").value,
    phone: document.getElementById("phone").value,
    subject: document.getElementById("subject").value,
    level: document.getElementById("level").value,
    faculty: document.getElementById("faculty").value,
    salaryFrom: document.getElementById("salaryMin").value,
    salaryTo: document.getElementById("salaryMax").value,
    urgency: document.getElementById("urgency").value,
    collectedBy: document.getElementById("collectedBy").value,
    notes: document.getElementById("notes").value
  };

  try {
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    });

    const result = await res.json();

    if (result.success) {
      status.style.color = "green";
      status.innerText = "✅ Vacancy saved successfully (ID: " + result.id + ")";
      document.getElementById("vacancyForm").reset();
    } else {
      status.style.color = "red";
      status.innerText = "❌ Could not save: " + result.error;
    }
  } catch (err) {
    status.style.color = "red";
    status.innerText = "❌ Network / Script error: " + err.message;
  }
});
</script>

</body>
</html>
