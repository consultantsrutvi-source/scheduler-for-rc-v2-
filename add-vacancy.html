<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Vacancy | Rutvi Consultants</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- MAIN STYLE -->
  <link rel="stylesheet" href="css/style.css" />

  <style>
    body {
      background: #f4f6f9;
      font-family: "Segoe UI", sans-serif;
      margin: 0;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #ddd;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      height: 42px;
    }

    nav a {
      margin-right: 18px;
      text-decoration: none;
      color: #333;
      font-weight: 500;
    }

    .logout-btn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .container {
      max-width: 980px;
      margin: 40px auto;
      padding: 0 16px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .grid-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .grid-1 {
      grid-template-columns: 1fr;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      display: block;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
    }

    .hidden {
      display: none;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 24px;
      gap: 12px;
    }

    .save-btn {
      background: #0d6efd;
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    .status-msg {
      margin-top: 16px;
      font-weight: 600;
    }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <img src="logo.png.jpg" alt="Rutvi Consultants">
    <strong>Scheduler for RC</strong>
  </div>

  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a href="assignments.html">Assignments</a>
  </nav>

  <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<div class="container">
  <div class="card">
    <h2>Add Vacancy</h2>
    <div class="subtitle">Enter college faculty requirement details</div>

    <form id="vacancyForm">
      <div class="grid">

        <div>
          <label>College Name *</label>
          <input id="college" required />
        </div>

        <div>
          <label>City *</label>
          <input list="cityList" id="city" required />
          <datalist id="cityList"></datalist>
        </div>

        <div>
          <label>Phone *</label>
          <input id="phone" required />
        </div>

        <div>
          <label>Subject *</label>
          <select id="subject" required>
            <option value="">Select</option>
            <option>Physics</option>
            <option>Chemistry</option>
            <option>Mathematics</option>
            <option>Biology</option>
            <option>Zoology</option>
            <option>Botany</option>
            <option>Others</option>
          </select>
        </div>

        <div id="subjectOtherBox" class="hidden">
          <label>Other Subject</label>
          <input id="subjectOther" />
        </div>

        <div>
          <label>Level *</label>
          <select id="level" required>
            <option value="">Select</option>
            <option>Boards</option>
            <option>KCET</option>
            <option>NEET</option>
            <option>JEE Mains</option>
            <option>JEE Advanced</option>
            <option>Foundation</option>
          </select>
        </div>

        <div>
          <label>Faculty Required *</label>
          <input type="number" id="faculty" required />
        </div>

        <div>
          <label>Salary From *</label>
          <select id="salaryFrom" required></select>
        </div>

        <div>
          <label>Salary To *</label>
          <select id="salaryTo" required></select>
        </div>

        <div>
          <label>Urgency *</label>
          <select id="urgency" required>
            <option>Immediate</option>
            <option>Within 1 Week</option>
            <option>Within 15 Days</option>
            <option>Within 1 Month</option>
          </select>
        </div>

        <div>
          <label>Collected By *</label>
          <input id="collectedBy" required />
        </div>

      </div>

      <div class="grid grid-1" style="margin-top:16px">
        <div>
          <label>Notes</label>
          <textarea id="notes" rows="3"></textarea>
        </div>
      </div>

      <div class="actions">
        <button type="submit" class="save-btn">💾 Save Vacancy</button>
      </div>

      <div id="status" class="status-msg"></div>
    </form>
  </div>
</div>

<!-- 🔹 PLACES SCRIPT (REPLACE URL IF NEEDED) -->
<script src="js/places.js"></script>

<script>
  /* ---------- LOGOUT ---------- */
  function logout() {
    localStorage.clear();
    sessionStorage.clear();
    window.location.href = "index.html";
  }

  /* ---------- LOAD CITIES ---------- */
  const cityList = document.getElementById("cityList");
  if (typeof cities !== "undefined") {
   cities.forEach(c => {
      const o = document.createElement("option");
      o.value = c;
      cityList.appendChild(o);
    });
  }

  /* ---------- SALARY DROPDOWN ---------- */
  const salaryFrom = document.getElementById("salaryFrom");
  const salaryTo = document.getElementById("salaryTo");

  for (let s = 50000; s <= 350000; s += 25000) {
    const label = "₹" + (s/1000) + "k";
    salaryFrom.add(new Option(label, s));
    salaryTo.add(new Option(label, s));
  }

  /* ---------- SUBJECT OTHER ---------- */
  document.getElementById("subject").addEventListener("change", e => {
    document.getElementById("subjectOtherBox")
      .classList.toggle("hidden", e.target.value !== "Others");
  });

  /* ---------- SUBMIT ---------- */
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsT3dyPERKTfYhTf4BjCo8mzLrzYGxhLmS0MLfXnjX3hElLESnqchauzgxV87uJ4BOMA/exec";

  document.getElementById("vacancyForm").addEventListener("submit", async e => {
    e.preventDefault();

    const status = document.getElementById("status");
    status.style.color = "#333";
    status.innerText = "⏳ Saving vacancy...";

    const payload = {
      college: college.value,
      city: city.value,
      phone: phone.value,
      subject: subject.value === "Others" ? subjectOther.value : subject.value,
      level: level.value,
      faculty: faculty.value,
      salaryFrom: salaryFrom.value,
      salaryTo: salaryTo.value,
      urgency: urgency.value,
      collectedBy: collectedBy.value,
      notes: notes.value
    };

    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      const result = await res.json();

      if (result.success) {
        status.style.color = "green";
        status.innerText = "✅ Vacancy saved successfully (ID: " + result.id + ")";
        e.target.reset();
      } else {
        status.style.color = "red";
        status.innerText = "❌ Could not save: " + result.error;
      }
    } catch (err) {
      status.style.color = "red";
      status.innerText = "❌ Network / Script error";
    }
  });
</script>

</body>
</html>
