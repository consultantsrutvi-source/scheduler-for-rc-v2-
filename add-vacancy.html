<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Vacancy – Rutvi Consultants CRM</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Premium font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; font-family: Inter, sans-serif; }

    body {
      margin: 0;
      background: linear-gradient(135deg, #eef4ff, #f6fff9);
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: linear-gradient(90deg, #0f766e, #2563eb);
      color: #fff;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0,0,0,.15);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 18px;
    }

    .brand img {
      height: 38px;
      border-radius: 6px;
    }

    nav a {
      color: #e0f2fe;
      margin-left: 22px;
      text-decoration: none;
      font-weight: 500;
    }

    nav a:hover { text-decoration: underline; }

    /* CARD */
    .container {
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .card {
      width: 100%;
      max-width: 980px;
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 30px 60px rgba(0,0,0,.1);
    }

    h1 {
      margin: 0 0 22px;
      font-size: 26px;
      font-weight: 700;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
    }

    input, select, textarea {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 14px;
    }

    textarea { resize: vertical; }

    .full { grid-column: span 3; }

    button {
      margin-top: 24px;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      background: linear-gradient(90deg, #2563eb, #16a34a);
      box-shadow: 0 10px 25px rgba(37,99,235,.4);
    }

    button:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    .status {
      margin-top: 12px;
      font-weight: 600;
      text-align: center;
    }

    .ok { color: #16a34a; }
    .err { color: #dc2626; }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <img src="logo.png.jpg">
    Rutvi Consultants – CRM
  </div>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
  </nav>
</header>

<div class="container">
  <div class="card">
    <h1>Add Vacancy</h1>

    <div class="grid">
      <div>
        <label>College Name *</label>
        <input id="college" />
      </div>

      <div>
        <label>City *</label>
        <select id="city"></select>
      </div>

      <div>
        <label>Phone *</label>
        <input id="phone" />
      </div>

      <div>
        <label>Subject *</label>
        <select id="subject">
          <option value="">Select</option>
          <option>Physics</option>
          <option>Chemistry</option>
          <option>Maths</option>
          <option>Biology</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div>
        <label>Level *</label>
        <select id="level">
          <option value="">Select</option>
          <option>KCET</option>
          <option>NEET</option>
          <option>Boards</option>
          <option>JEE</option>
          <option>Foundation</option>
          <option>Other</option>
        </select>
      </div>

      <div>
        <label>Faculty Required *</label>
        <input id="faculty" type="number" min="1">
      </div>

      <div>
        <label>Salary From *</label>
        <select id="salaryFrom">
  <option value="">Select</option>
  <option value="50000">₹50,000</option>
  <option value="75000">₹75,000</option>
  <option value="100000">₹1,00,000</option>
  <option value="150000">₹1,50,000</option>
  <option value="200000">₹2,00,000</option>
  <option value="250000">₹2,50,000</option>
  <option value="300000">₹3,00,000</option>
  <option value="350000">₹3,50,000</option>
</select>

      </div>

      <div>
        <label>Salary To *</label>
        <select id="salaryTo">
  <option value="">Select</option>
  <option value="50000">₹50,000</option>
  <option value="75000">₹75,000</option>
  <option value="100000">₹1,00,000</option>
  <option value="150000">₹1,50,000</option>
  <option value="200000">₹2,00,000</option>
  <option value="250000">₹2,50,000</option>
  <option value="300000">₹3,00,000</option>
  <option value="350000">₹3,50,000</option>
</select>

      </div>

      <div>
        <label>Urgency *</label>
        <select id="urgency">
          <option value="">Select</option>
          <option>Immediate</option>
          <option>Within 7 Days</option>
          <option>Within 15 Days</option>
          <option>Flexible</option>
        </select>
      </div>

      <div class="full">
        <label>Collected By *</label>
        <input id="collectedBy">
      </div>

      <div class="full">
        <label>Notes</label>
        <textarea id="notes"></textarea>
      </div>
    </div>

    <button id="saveBtn" onclick="saveVacancy()">Save Vacancy</button>
    <div id="msg" class="status"></div>
  </div>
</div>
<div id="statusMsg" style="margin-top:10px;font-weight:600;"></div>

<!-- IMPORTANT: places.js -->

<script src="js/places.js"></script>

<script>
  window.addEventListener("load", () => {
    if (typeof loadCities === "function") {
      loadCities("city");
    } else {
      console.error("places.js not loaded");
    }
  });
</script>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";

async function saveVacancy() {
  const data = {
    college: document.getElementById("college").value.trim(),
    city: document.getElementById("city").value,
    phone: document.getElementById("phone").value.trim(),
    subject: document.getElementById("subject").value,
    level: document.getElementById("level").value,
    faculty: document.getElementById("faculty").value,   // 🔥 REQUIRED
    salaryFrom: document.getElementById("salaryFrom").value,
    salaryTo: document.getElementById("salaryTo").value,
    urgency: document.getElementById("urgency").value,
    collectedBy: document.getElementById("collectedBy").value,
    notes: document.getElementById("notes").value
  };

  // basic validation
  for (let k in data) {
    if (!data[k] && k !== "notes") {
      showMessage("Please fill all required fields", false);
      return;
    }
  }

  showMessage("Saving...", true);

  const res = await fetch(SCRIPT_URL + "?action=addVacancy", {
    method: "POST",
    body: JSON.stringify(data)
  });

  const json = await res.json();

  if (json.success) {
    showMessage(`Vacancy Saved ✅ ID: ${json.id}`, true);
    clearForm();
  } else {
    showMessage(json.error || "Could not save vacancy", false);
  }
}

function clearForm() {
  document.querySelectorAll("input, select, textarea").forEach(el => {
    if (el.tagName !== "SELECT") el.value = "";
    else el.selectedIndex = 0;
  });
}

function showMessage(msg, success) {
  const box = document.getElementById("statusMsg");
  box.innerText = msg;
  box.style.color = success ? "green" : "red";
}
</script>
</body>
</html>
