<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Vacancy | Rutvi Consultants CRM</title>

<link rel="stylesheet" href="css/style.css">
<script src="js/places.js"></script>

<style>
body{
  font-family: "Segoe UI", sans-serif;
  background: linear-gradient(120deg,#f8fafc,#eef2ff);
  margin:0;
}
header{
  background: linear-gradient(135deg,#6366f1,#22c55e);
  color:white;
  padding:14px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
header img{height:40px}
nav a{
  color:white;
  margin:0 14px;
  text-decoration:none;
  font-weight:500;
}
nav a:hover{text-decoration:underline}
.logout{
  background:#ef4444;
  padding:8px 16px;
  border-radius:10px;
  color:white;
}

.container{
  max-width:900px;
  margin:50px auto;
}
.card{
  background:white;
  border-radius:20px;
  padding:35px;
  box-shadow:0 25px 45px rgba(0,0,0,.08);
}
.card h2{
  margin-bottom:25px;
  color:#334155;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:20px;
}

label{
  font-size:13px;
  color:#475569;
}
input,select,textarea{
  width:100%;
  padding:11px;
  border-radius:10px;
  border:1px solid #c7d2fe;
  margin-top:6px;
}
textarea{grid-column:1/4}

.primary-btn{
  background: linear-gradient(135deg,#6366f1,#22c55e);
  color:white;
  padding:14px 40px;
  border:none;
  border-radius:14px;
  font-size:15px;
  font-weight:600;
  box-shadow:0 12px 25px rgba(99,102,241,.35);
  cursor:pointer;
}
.primary-btn:hover{transform:translateY(-1px)}

.status{
  margin-top:15px;
  font-weight:600;
}
.success{color:#16a34a}
.error{color:#dc2626}
</style>
</head>

<body>

<header>
  <div style="display:flex;align-items:center;gap:12px">
    <img src="logo.png.jpg" alt="logo">
    <strong>Rutvi Consultants CRM</strong>
  </div>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="vacancies.html">Vacancies</a>
    <a href="lecturers.html">Lecturers</a>
    <a href="assignments.html">Assignments</a>
    <a class="logout" href="index.html">Logout</a>
  </nav>
</header>

<div class="container">
<div class="card">
<h2>Add Vacancy</h2>

<div class="grid">
<div>
<label>College Name *</label>
<input id="college">
</div>

<div>
<label>City *</label>
<select id="city"></select>
</div>

<div>
<label>Phone *</label>
<input id="phone">
</div>

<div>
<label>Subject *</label>
<select id="subject">
<option value="">Select</option>
<option>Physics</option>
<option>Chemistry</option>
<option>Biology</option>
<option>Mathematics</option>
<option>Other</option>
</select>
<input id="subjectOther" placeholder="Enter subject" style="display:none">
</div>

<div>
<label>Level *</label>
<select id="level">
<option value="">Select</option>
<option>NEET</option>
<option>KCET</option>
<option>Boards</option>
<option>Other</option>
</select>
<input id="levelOther" placeholder="Enter level" style="display:none">
</div>

<div>
<label>Faculty Required *</label>
<input id="faculty">
</div>

<div>
<label>Salary From *</label>
<select id="salaryFrom"></select>
</div>

<div>
<label>Salary To *</label>
<select id="salaryTo"></select>
</div>

<div>
<label>Urgency *</label>
<select id="urgency">
<option value="">Select</option>
<option>Immediate</option>
<option>Within 7 Days</option>
<option>Within 15 Days</option>
<option>Flexible</option>
</select>
</div>

<div>
<label>Collected By *</label>
<input id="collectedBy">
</div>

<textarea id="notes" placeholder="Notes (optional)"></textarea>
</div>

<br>
<button class="primary-btn" onclick="saveVacancy()">Save Vacancy</button>
<div id="msg" class="status"></div>

</div>
</div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbw0KWk6HU-bszXrPOIG4xguuTxiaH7WxOQvFy4FcIsv3t7pBvwK-U-Vb4_rScr71CIsyg/exec";

const salaries=[
{l:"₹50k",v:50000},{l:"₹75k",v:75000},{l:"₹1L",v:100000},
{l:"₹1.25L",v:125000},{l:"₹1.5L",v:150000},
{l:"₹1.75L",v:175000},{l:"₹2L",v:200000},
{l:"₹2.5L",v:250000},{l:"₹3L",v:300000},
{l:"₹3.5L",v:350000}
];

function loadSalary(){
["salaryFrom","salaryTo"].forEach(id=>{
const s=document.getElementById(id);
s.innerHTML="<option value=''>Select</option>";
salaries.forEach(x=>s.add(new Option(x.l,x.v)));
});
}

document.getElementById("subject").onchange=()=>subjectOther.style.display=subject.value==="Other"?"block":"none";
document.getElementById("level").onchange=()=>levelOther.style.display=level.value==="Other"?"block":"none";

function saveVacancy(){
msg.textContent="Saving...";
msg.className="status";

fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify({
action:"addVacancy",
CollegeName:college.value,
City:city.value,
Phone:phone.value,
Subject:subject.value==="Other"?subjectOther.value:subject.value,
Level:level.value==="Other"?levelOther.value:level.value,
FacultyRequired:faculty.value,
SalaryFrom:Number(salaryFrom.value),
SalaryTo:Number(salaryTo.value),
Urgency:urgency.value,
CollectedBy:collectedBy.value,
Notes:notes.value
})
}).then(r=>r.json()).then(res=>{
if(res.success){
msg.textContent="Vacancy saved successfully";
msg.className="status success";
}else{
msg.textContent="Could not save vacancy";
msg.className="status error";
}
});
}

document.addEventListener("DOMContentLoaded",()=>{
loadSalary();
loadCities("city");
});
</script>

</body>
</html>
